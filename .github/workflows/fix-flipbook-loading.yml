name: Fix flipbook loading flash
on: workflow_dispatch
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply loading-flash patch to all flipbooks
        run: |
          python3 - <<'EOF'
          import glob
          CSS_OLD = "</style>"
          CSS_NEW = '#book{opacity:0}#book.ready{opacity:1}body::after{content:"Loading book...";position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font:700 20px system-ui,sans-serif;color:#94a3b8}body.ready::after{content:none}</style>'
          JS_OLD = "pageFlip.loadFromHTML(book.querySelectorAll('.pg'))"
          JS_NEW = "try{pageFlip.loadFromHTML(book.querySelectorAll('.pg'))}finally{document.body.classList.add('ready');book.classList.add('ready')}"
          patched=skipped=failed=0
          for p in sorted(glob.glob('AzharEd_Site/AzharEd_Site/AzharEd_Deploy/*/Flipbooks/*.html')):
              t=open(p,encoding='utf-8').read()
              if '#book.ready' in t:
                  skipped+=1; continue
              if t.count(CSS_OLD)!=1 or t.count(JS_OLD)!=1:
                  print('ANCHOR MISMATCH', p, t.count(CSS_OLD), t.count(JS_OLD)); failed+=1; continue
              t=t.replace(CSS_OLD,CSS_NEW).replace(JS_OLD,JS_NEW)
              open(p,'w',encoding='utf-8').write(t); patched+=1
          swp='AzharEd_Site/AzharEd_Site/AzharEd_Deploy/sw.js'
          sw=open(swp,encoding='utf-8').read()
          if 'azhared-v3' in sw:
              open(swp,'w',encoding='utf-8').write(sw.replace('azhared-v3','azhared-v4'))
              print('sw.js cache bumped to v4')
          print('patched',patched,'skipped',skipped,'failed',failed)
          assert failed==0 and patched>0
          EOF
      - name: Commit and push
        run: |
          git config user.name "omerazharbhatti-design"
          git config user.email "omerazharbhatti@gmail.com"
          git add -A
          git diff --cached --quiet || git commit -m "Hide flipbook pages until fully loaded - fixes flip-to-end flash on slow connections"
          git push
