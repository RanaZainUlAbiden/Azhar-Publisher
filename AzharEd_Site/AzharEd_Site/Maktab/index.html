    info:{school:schoolName||"",student:prefill.student,father:"",cls:prefill.cls,roll:"",term:prefill.term,session:"2026–27",present:"",total:""},
    subs:prefill.subs
  }:(saved||{
    info:{school:schoolName||"",student:"",father:"",cls:"",roll:"",term:"First Term",session:"2026–27",present:"",total:""},
    subs:[{name:"English",total:100,got:0},{name:"Urdu",total:100,got:0},{name:"Counting / Maths",total:100,got:0},{name:"General Knowledge",total:50,got:0},{name:"Rhymes & Drawing",total:50,got:0}]
  });
  const [info,setInfo]=useState(base.info);
  const [subs,setSubs]=useState(base.subs);
  const [skills,setSkills]=useState((saved&&saved.skills)||[
    ["Listens attentively","Very Good"],["Follows instructions","Good"],["Fine-motor / pencil control","Very Good"],
    ["Social skills & sharing","Excellent"],["Class participation","Good"],["Letter / number recognition","Very Good"]]);
  const [remarks,setRemarks]=useState((saved&&saved.remarks)||"A cheerful and hardworking child, making steady progress and taking part enthusiastically in class activities.");
  useEffect(()=>{ setSaved({info,subs,skills,remarks}); },[info,subs,skills,remarks]);

      BOOKS.filter(b=>b.level===cls&&QBANK[b.id]&&b.subject===(alias[subject]||subject))
        .forEach(b=>QBANK[b.id].items.forEach(q=>pool.push(Object.assign({},q))));
      (QB[subject+"|primary"]||[]).forEach(s2=>pool.push({k:"short",text:s2,answer:""}));
    }
    qbank.filter(q=>q.target===target).forEach(q=>pool.push({k:"short",text:q.text,answer:""}));
    if(!pool.length){toast("No questions in this page range — widen it","⚠️");return;}
    shuffle(pool);
    const seen={},out=[];
    pool.forEach(q=>{ if(!seen[q.text]&&out.length<count){ seen[q.text]=1; out.push(q); } });
    out.forEach(q=>{ if(q.k==="match"&&q.pairs){ q.left=q.pairs.map(p=>p[0]); q.right=shuffle(q.pairs.map(p=>p[1]).slice()); } });
    setPaper(out); toast("Paper ready — "+out.length+" questions","📝");
  };
  const esc2=s2=>String(s2).replace(/</g,"&lt;");
  const qHTML=(q,i)=>{
    let body;
    if(q.k==="mcq") body=`<div>${esc2(q.text)}</div><div style="margin-top:9px">${q.options.map(o=>`◯ ${esc2(o)}`).join("&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;")}</div>`;
    else if(q.k==="match") body=`<div>${esc2(q.text)}</div><table style="margin-top:9px;width:auto;border-collapse:collapse"><tr>${q.left.map(l=>`<td style="border:1px solid #ccd3e0;padding:6px 14px;text-align:center">${esc2(l)}</td>`).join("")}</tr><tr>${q.right.map(r2=>`<td style="border:1px solid #ccd3e0;padding:6px 14px;text-align:center">${esc2(r2)}</td>`).join("")}</tr></table><div style="font-size:11px;color:#99a;margin-top:4px">Draw lines to match the two rows.</div>`;
    else body=`<div>${esc2(q.text)}</div>`;
    return `<div style="display:flex;gap:10px;margin:0 0 24px;font-size:14px"><b>${i+1}.</b><div style="flex:1">${body}</div><span style="color:#99a;font-size:11px;white-space:nowrap">/ 1</span></div>`;
  };
  const printPaper=withKey=>{ if(!paper)return;
    const src=early?(book?book.title+" · pages "+pgFrom+"–"+pgTo+" · "+cls:""):subject+" · Class "+cls;
    const key=withKey?`<div style="page-break-before:always"><h1 style="font-size:16px">Answer Key (teacher copy)</h1>`+paper.map((q,i)=>{
        let a=q.answer||""; if(q.k==="match"&&q.pairs)a=q.pairs.map(p=>p[0]+" → "+p[1]).join(" ,  ");
        return a?`<div style="font-size:12.5px;margin-bottom:6px"><b>${i+1}.</b> ${esc2(a)} ${q.pg?'<span style="color:#99a">(p. '+q.pg+')</span>':''}</div>`:"";
      }).join("")+"</div>":"";
    printHTML(title,
      `<h1>${esc2(schoolName)}</h1><div class="sub">${esc2(title)} · ${esc2(src)} · Total Marks: ${paper.length}</div>
       <div style="display:flex;gap:26px;font-size:13px;margin:14px 0 24px;flex-wrap:wrap"><span>Name: __________________</span><span>Roll No: ______</span><span>Date: __________</span></div>
       ${paper.map(qHTML).join("")}${key}`);
  };
  const addQ=()=>{ const v=nq.trim(); if(!v||!target)return;
    setQbank(p=>[...p,{id:Date.now(),target,text:v}]); setNq(""); toast("Question added"); };
  const myQs=qbank.filter(q=>q.target===target);
  const inRange=bank?bank.items.filter(q=>q.pg>=pgFrom&&q.pg<=pgTo).length:0;
  return (
   <div>
    <div className="page-head"><h2>📝 {t("Paper Generator")}</h2>
      <p>Pick the book and the pages you've taught, press Generate, print. Every paper is built from the book's own pages.</p></div>
    <div className="card">
      <div className="rc-toolbar" style={{marginBottom:0}}>
        <select className="tt-sel" value={cls} onChange={e=>{setCls(e.target.value);setPaper(null);}}>{TT_CLASSES.map(c=><option key={c}>{c}</option>)}</select>
        {early
          ? <select className="tt-sel" value={bookId} onChange={e=>{setBookId(e.target.value);setPaper(null);}} style={{maxWidth:250}}>
              {levelBooks.map(b=><option key={b.id} value={b.id} disabled={!QBANK[b.id]}>{b.title}{QBANK[b.id]?"":" (no bank)"}</option>)}
            </select>
          : <select className="tt-sel" value={subject} onChange={e=>{setSubject(e.target.value);setPaper(null);}}>{SUBJECT_POOL.primary.map(s2=><option key={s2}>{s2}</option>)}</select>}
        {early&&bank&&<span style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:13,fontWeight:700}}>p.
          <input type="number" className="date-inp" style={{width:62,padding:'6px 8px'}} min={1} max={maxPage} value={pgFrom} onChange={e=>{setPgFrom(Math.max(1,+e.target.value||1));setPaper(null);}}/>–
          <input type="number" className="date-inp" style={{width:62,padding:'6px 8px'}} min={1} max={maxPage} value={pgTo} onChange={e=>{setPgTo(Math.min(maxPage,+e.target.value||maxPage));setPaper(null);}}/></span>}
        <select className="tt-sel" value={count} onChange={e=>setCount(+e.target.value)}>{[5,10,15,20].map(n=><option key={n} value={n}>{n} Qs</option>)}</select>
        <select className="tt-sel" value={title} onChange={e=>setTitle(e.target.value)}>{["Monthly Test","Class Test","1st Term Exam","2nd Term Exam","3rd Term Exam","Practice Worksheet"].map(x=><option key={x}>{x}</option>)}</select>
        <button className="btn btn-navy" onClick={generate}>🎲 Generate paper</button>
      </div>
      <p className="hint">{early
        ?(bank?inRange+" questions available in this range (book has "+maxPage+" pages). Ready-made PDF papers stay on each book's page in the Library.":"Pick a book to begin.")
        :"Classes One–Five use the subject bank plus questions from that class’s own books (like the Al-Fatah series) where available. Maths and Tables sums are freshly generated every time."}
        {" "}<button className="link-btn" onClick={()=>setShowAdd(x=>!x)}>{showAdd?"Hide my questions":"➕ Add your own questions"}</button></p>
      {showAdd&&<div style={{marginTop:6}}>
        <div className="quick-add" style={{marginBottom:6}}>
          <input placeholder="Type a question to add…" value={nq} onChange={e=>setNq(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addQ()} style={{maxWidth:520}}/>
          <button className="btn btn-navy btn-sm" onClick={addQ}>Add</button>
        </div>
        {myQs.map(q=><div key={q.id} className="notice-item"><div style={{fontSize:13}}>{q.text}</div><button className="del-btn" onClick={()=>setQbank(p=>p.filter(x=>x.id!==q.id))}>✕</button></div>)}
      </div>}
    </div>
    {paper && <div className="card" style={{borderLeft:'4px solid var(--green)'}}>
      <div className="card-flex"><h3>✅ {title} · {early?(book?book.title:""):subject+" · Class "+cls} · {paper.length} questions</h3>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <button className="btn btn-navy btn-sm" onClick={()=>printPaper(false)}>🖨️ Print for students</button>
          <button className="btn btn-outline btn-sm" onClick={()=>printPaper(true)}>🖨️ Print with answers</button>
          <button className="mini-btn ghost" onClick={generate}>🔄 Shuffle</button>
        </div></div>
      {paper.map((q,i)=><div key={i} style={{display:'flex',gap:10,padding:'10px 0',borderBottom:'1px solid var(--border)',fontSize:13.5,alignItems:'flex-start'}}>
        <b style={{color:'var(--brand)'}}>{i+1}.</b>
        <div style={{flex:1}}>
          <div>{q.text}</div>
          {q.k==="mcq"&&<div style={{marginTop:5,color:'var(--muted)',fontSize:12.5}}>{q.options.map((o,oi)=><span key={oi} style={{marginRight:16}}>◯ {o}</span>)}</div>}
          {q.k==="match"&&<div style={{marginTop:5,color:'var(--muted)',fontSize:12.5}}>{q.left.join("  ·  ")}  ⇄  {q.right.join("  ·  ")}</div>}
        </div>
        {q.pg?<span className="mini" title={q.pt}>p. {q.pg}</span>:null}
      </div>)}
    </div>}
   </div>
  );
}

/* ---------- LESSON PLANNER ---------- */
function Planner({schoolName,openBook}){
  const [cls,setCls]=useLS("pl:cls","Nursery");
  const [sec,setSec]=useLS("pl:sec","A");
  const [term,setTerm]=useLS("pl:term","1st Term");
  const [week,setWeek]=useLS("pl:week",1);
  const [plans,setPlans]=useLS("planner",{});
  /* the school's own planning subjects — add or remove per age group */
  const [plSubs,setPlSubs]=useLS("pl:subjects",{early:SUBJECT_POOL.early,primary:SUBJECT_POOL.primary});
  const [newSub,setNewSub]=useState("");
  const poolKey=isEarly(cls)?"early":"primary";
  const subs=plSubs[poolKey]||[];
  const addSubject=()=>{ const s=newSub.trim(); if(!s) return;
    if(subs.some(x=>x.toLowerCase()===s.toLowerCase())){toast("That subject is already listed","⚠️");setNewSub("");return;}
    setPlSubs({...plSubs,[poolKey]:[...subs,s]}); setNewSub(""); };
  const removeSubject=s2=>setPlSubs({...plSubs,[poolKey]:subs.filter(x=>x!==s2)});
  const key=cls+" "+sec+"|"+term+"|W"+week;
  const plan=plans[key]||{rows:{},notes:""};
  const setRow=(s2,v)=>setPlans({...plans,[key]:{rows:{...plan.rows,[s2]:v},notes:plan.notes}});
  const setNotes=v=>setPlans({...plans,[key]:{rows:plan.rows,notes:v}});
  const copyPrev=()=>{ if(week<=1){toast("This is week 1","ℹ️");return;}
    const pk=cls+" "+sec+"|"+term+"|W"+(week-1);
    if(plans[pk]){ setPlans({...plans,[key]:JSON.parse(JSON.stringify(plans[pk]))}); toast("Copied week "+(week-1)+" — edit what's new","📋"); }
    else toast("Week "+(week-1)+" has no plan yet","ℹ️"); };
  const esc2=s2=>String(s2).replace(/</g,"&lt;");
  const printWeek=()=>printHTML("Lesson Plan "+cls+" "+sec,
    `<h1>${esc2(schoolName)}</h1><div class="sub">Weekly Lesson Plan — ${esc2(cls)} ${esc2(sec)} · ${esc2(term)} · Week ${week}</div>
     <table><tr><th style="width:150px">Subject</th><th>Topic · Book pages · Activity</th></tr>
     ${subs.map(s2=>`<tr><td><b>${esc2(s2)}</b></td><td>${esc2(plan.rows[s2]||"")||"—"}</td></tr>`).join("")}</table>
     ${plan.notes?`<p style="font-size:12.5px;margin-top:14px"><b>Notes:</b> ${esc2(plan.notes)}</p>`:""}`);
  const filled=subs.filter(s2=>plan.rows[s2]&&plan.rows[s2].trim()).length;
  return (
   <div>
    <div className="page-head"><h2>🗓️ {t("Lesson Planner")}</h2>
      <p>One line per subject per week — what you'll teach and which book pages. Saves as you type.</p></div>
    <div className="card">
      <div className="rc-toolbar">
        <select className="tt-sel" value={cls} onChange={e=>setCls(e.target.value)}>{TT_CLASSES.map(c=><option key={c}>{c}</option>)}</select>
        <select className="tt-sel" value={sec} onChange={e=>setSec(e.target.value)}>{TT_SECTIONS.map(x=><option key={x}>Sec {x}</option>)}</select>
        <select className="tt-sel" value={term} onChange={e=>setTerm(e.target.value)}>{GB_TERMS.map(x=><option key={x}>{x}</option>)}</select>
        <select className="tt-sel" value={week} onChange={e=>setWeek(+e.target.value)}>{Array.from({length:14},(_,i)=>i+1).map(w2=><option key={w2} value={w2}>Week {w2}</option>)}</select>
        <button className="mini-btn ghost" onClick={copyPrev}>📋 Copy last week</button>
        <button className="mini-btn ghost" onClick={printWeek}>🖨️ Print this week</button>
        <span style={{fontSize:12,fontWeight:800,color:filled===subs.length&&filled>0?'var(--green)':'var(--muted)'}}>{filled}/{subs.length} planned · 💾 auto-saves</span>
      </div>
      <table className="gtable"><thead><tr><th style={{width:170}}>Subject</th><th>What will you teach? (topic · book pages · activity)</th><th className="rc-gut no-print"></th></tr></thead>
        <tbody>{subs.map(s2=><tr key={s2}><td><b>{s2}</b></td>
          <td><input className="tt-inp" style={{textAlign:'left',minWidth:220}} placeholder={"e.g. "+(isEarly(cls)?"Counting book p. 12–15 · numbers 6–10":"Unit 3 · exercise Q1–5")} value={plan.rows[s2]||""} onChange={e=>setRow(s2,e.target.value)}/></td>
          <td className="rc-gut no-print">{subs.length>1 &&
            <button className="rc-x" title={"Remove "+s2+" from this list"} onClick={()=>removeSubject(s2)}>−</button>}</td></tr>)}
          <tr className="add-row no-print"><td colSpan={3}>
            <div className="add-wrap">
              <input id="plNewSub" className="add-inp" placeholder="New subject name… e.g. Nazra, Tarbiyah, Computer"
                value={newSub} onChange={e=>setNewSub(e.target.value)}
                onKeyDown={e=>{if(e.key==='Enter')addSubject();}}/>
              <button className="add-btn" data-addsub onClick={addSubject}>＋ Add subject</button>
            </div></td></tr>
        </tbody>
      </table>
      <div className="field" style={{marginTop:14}}><label>Notes for the week (optional)</label>
        <input value={plan.notes} onChange={e=>setNotes(e.target.value)} placeholder="e.g. Monthly Test 2 on Friday · PTM Saturday"/></div>
    </div>
   </div>
  );
}

function ageFrom(dob){
  if(!dob) return "";
  const d=new Date(dob); if(isNaN(d.getTime())) return "";
  const t=new Date(); let a=t.getFullYear()-d.getFullYear();
  const m=t.getMonth()-d.getMonth();
  if(m<0||(m===0&&t.getDate()<d.getDate())) a--;
  return (a>=0&&a<120)?String(a):"";
}

  const early=isEarly(cls);

  for(let d=0;d<TT_DAYS.length;d++){ const row=[];

    grid.push(row); }
  return grid;
}

    <div class="h"><h1>${schoolName}</h1><div class="s">FEE PAYMENT RECEIPT</div><p>Powered by AzharEd · Book Factory</p></div>

/* ---------- OWNER DASHBOARD — Azhar Publishers only ---------- */
function ago(iso){ if(!iso) return "never"; const m=Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(m<1) return "just now"; if(m<60) return m+" min ago"; const h=Math.round(m/60); if(h<24) return h+"h ago";
  const d=Math.round(h/24); if(d<30) return d+"d ago"; return Math.round(d/30)+"mo ago"; }
function when(iso){ if(!iso) return "—"; const d=new Date(iso); return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }
function health(sc){ /* traffic light for a school: green if used this week, amber if within a month, red otherwise */
  const last=sc.last_signin?new Date(sc.last_signin).getTime():0; const days=(Date.now()-last)/86400000;
  if(sc.active===false) return ["Suspended","#8a93a6"];
  if(!last) return ["Never signed in","#e94560"];
  if(days<=7) return ["Active this week","#00a884"];
  if(days<=30) return ["Quiet · "+Math.round(days)+" days","#F0A500"];
  return ["Inactive · "+Math.round(days)+" days","#e94560"]; }

function OwnerDash({user}){
  const [data,setData]=useState(()=>LS.get("owner:cache",null));
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const [tab,setTab]=useState("schools");
  const [days,setDays]=useState(14);
  const load=async(d)=>{
    setBusy(true); setErr("");
    if(!navigator.onLine){ setBusy(false); setErr("You're offline — showing the last figures this laptop fetched."); return; }
    try{
      const {data:res,error}=await withTimeout(SB.rpc("owner_overview",{p_days:d||days}),20000);
      if(error) throw new Error(error.message);
      setData(res); LS.set("owner:cache",res);
    }catch(e){ setErr(/Owner only/i.test(e.message||"")?"This page is for the Azhar Publishers owner account only.":("Couldn't reach the cloud: "+(e.message||"try again"))); }
    setBusy(false);
  };
  useEffect(()=>{ load(days); },[]);
  const t=(data&&data.totals)||{};
  const schools=(data&&data.schools)||[], accounts=(data&&data.accounts)||[], signins=(data&&data.signins)||[];
  const byDay=(data&&data.signins_by_day)||[], backups=(data&&data.backups)||[], views=(data&&data.sample_views)||[], quotes=(data&&data.sample_quotes)||[];
  /* fill the day chart so quiet days show as empty bars, not gaps */
  const dayMap={}; byDay.forEach(x=>{dayMap[x.day]=+x.n;});
  const series=Array.from({length:days},(_,i)=>{ const d=new Date(); d.setDate(d.getDate()-(days-1-i)); const k=d.toISOString().slice(0,10); return {k,n:dayMap[k]||0,lbl:d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})}; });
  const maxN=Math.max(1,...series.map(x=>x.n));
  const esc=x=>String(x==null?"":x).replace(/</g,"&lt;");
  const exportSchools=()=>downloadCSV("MAKTAB_schools_"+todayISO()+".csv",
    [["School","Status","Accounts","Admin emails","Last sign-in","Sign-ins 7d","Last backup","Backups 7d","Devices","Backup KB"],
     ...schools.map(sc=>[sc.name,health(sc)[0],sc.accounts,sc.admins,sc.last_signin||"",sc.signins_7d,sc.last_backup||"",sc.backups_7d,sc.devices,Math.round((sc.backup_bytes||0)/1024)])]);
  const kpi=(cls,ic,v,l)=><div className={"kpi "+cls}><div className="ic">{ic}</div><div className="v">{v}</div><div className="l">{l}</div></div>;
  return (
   <div>
    <div className="page-head"><h2>🏢 Owner dashboard</h2>
      <p>Every school on MAKTAB, in one place — who is signing in, whose laptops are backing up, and who is browsing the sample library. Only the Azhar Publishers owner account can see this.</p></div>
    <div className="card-flex" style={{marginBottom:16}}>
      <div style={{fontSize:12.5,color:'var(--muted)'}}>{data?("Figures as of "+when(data.generated_at)+" · "+ago(data.generated_at)):"No figures yet"}</div>
      <div style={{display:'flex',gap:8,alignItems:'center'}}>
        <button className="mini-btn" data-ownerrefresh onClick={()=>load(days)} disabled={busy}>{busy?"Refreshing…":"⟳ Refresh"}</button>
        <button className="mini-btn ghost" onClick={exportSchools}>📥 Schools CSV</button>
      </div>
    </div>
    {err && <div className="card" style={{borderLeft:'4px solid var(--red)',padding:'12px 16px',fontSize:13}}>{err}</div>}
    <div className="kpi-grid" data-ownerkpis>
      {kpi("","🏫",t.schools||0,"Schools")}
      {kpi("","👥",t.accounts||0,"Accounts")}
      {kpi("green","🔑",t.signins_7d||0,"Sign-ins · last 7 days")}
      {kpi("gold","☁️",t.backups_7d||0,"Backups · last 7 days")}
      {kpi("","📚",t.views_7d||0,"Sample views · last 7 days")}
      {kpi("red","💬",t.quotes_all||0,"Quote requests")}
    </div>

    <div className="sms-tabs">
      {[["schools","🏫","Schools"],["signins","🔑","Sign-ins"],["backups","☁️","Backups"],["samples","📚","e-Samples"]].map(([id,ic,l])=>
        <div key={id} className={"sms-tab"+(tab===id?" active":"")} onClick={()=>setTab(id)}>{ic} {l}</div>)}
    </div>

    {tab==="schools" && <div className="card">
      <h3>Schools · {schools.length}</h3>
      <table className="gtable"><thead><tr><th>School</th><th>Status</th><th>Accounts</th><th>Last sign-in</th><th>7d sign-ins</th><th>Last backup</th><th>7d backups</th><th>Laptops</th></tr></thead>
        <tbody>{schools.map(sc=>{ const [lbl,col]=health(sc); return <tr key={sc.id}>
          <td><b>{sc.name}</b><div style={{fontSize:11,color:'var(--muted)'}}>{sc.admins||"no admin yet"} · since {when(sc.created_at).split(" ")[0]} {when(sc.created_at).split(" ")[1]}</div></td>
          <td><span className="pill" style={{background:col+"22",color:col}}>{lbl}</span></td>
          <td>{sc.accounts}</td>
          <td title={when(sc.last_signin)}>{ago(sc.last_signin)}</td>
          <td>{sc.signins_7d}</td>
          <td title={when(sc.last_backup)}>{ago(sc.last_backup)}</td>
          <td>{sc.backups_7d}</td>
          <td>{sc.devices||0}</td></tr>; })}
          {schools.length===0 && <tr><td colSpan={8} className="empty-row">{busy?"Loading…":"No schools yet."}</td></tr>}
        </tbody></table>
      <p className="hint">Green = someone at the school signed in this week. Amber = within a month. Red = longer, or never. "Laptops" counts the distinct devices that have backed up.</p>
    </div>}

    {tab==="signins" && <div>
      <div className="card">
        <div className="card-flex"><h3>Sign-ins per day</h3>
          <div className="filter-bar" style={{margin:0}}>{[7,14,30,60].map(d=><span key={d} className={"fchip"+(days===d?" active":"")} onClick={()=>{setDays(d);load(d);}}>{d} days</span>)}</div></div>
        <div className="bars">{series.map(x=><div key={x.k} className="bar-col" title={x.lbl+": "+x.n}>
          <div className="bar-fill" style={{height:Math.round(x.n/maxN*100)+"%"}}></div>
          <div className="bar-n">{x.n||""}</div>
          <div className="bar-l">{x.lbl.split(" ")[0]}</div></div>)}</div>
        <p className="hint">{t.signins_all||0} sign-ins recorded in total. This history lives in your own database, so it never expires.</p>
      </div>
      <div className="card"><h3>Recent sign-ins</h3>
        <table className="gtable"><thead><tr><th>When</th><th>Who</th><th>Role</th><th>School</th><th>Device</th></tr></thead>
          <tbody>{signins.map((l,i)=><tr key={i}><td title={when(l.at)}>{ago(l.at)}</td><td>{l.email}</td><td>{l.role}</td><td>{l.school||"—"}</td><td style={{fontSize:11.5,color:'var(--muted)'}}>{l.device||"—"}</td></tr>)}
            {signins.length===0 && <tr><td colSpan={5} className="empty-row">No sign-ins recorded yet — the log starts from the next time anyone signs in.</td></tr>}</tbody></table>
      </div>
      <div className="card"><h3>All accounts · {accounts.length}</h3>
        <table className="gtable"><thead><tr><th>Email</th><th>Name</th><th>Role</th><th>School</th><th>Last sign-in</th><th>Created</th></tr></thead>
          <tbody>{accounts.map((a,i)=><tr key={i}><td>{a.email}</td><td>{a.name||"—"}</td><td>{a.role}</td><td>{a.school||"—"}</td><td title={when(a.last_signin)}>{ago(a.last_signin)}</td><td>{when(a.created_at).split(" ")[0]} {when(a.created_at).split(" ")[1]}</td></tr>)}</tbody></table>
      </div>
    </div>}

    {tab==="backups" && <div className="card">
      <h3>Recent cloud backups · {t.backups_all||0} in total</h3>
      <table className="gtable"><thead><tr><th>When</th><th>School</th><th>Laptop</th><th>Size</th></tr></thead>
        <tbody>{backups.map((b,i)=><tr key={i}><td title={when(b.at)}>{ago(b.at)}</td><td>{b.school||"—"}</td><td style={{fontSize:12,color:'var(--muted)'}}>{b.device||"—"}</td><td>{Math.round((b.bytes||0)/1024)} KB</td></tr>)}
          {backups.length===0 && <tr><td colSpan={4} className="empty-row">No backups yet.</td></tr>}</tbody></table>
      <p className="hint">Each laptop backs itself up once a day when it is online. A school whose backups stop is a school whose laptops are off, offline — or not being used.</p>
    </div>}

    {tab==="samples" && <div>
      <div className="card"><h3>Quote requests · {quotes.length}</h3>
        <table className="gtable"><thead><tr><th>When</th><th>Name</th><th>School</th><th>Phone</th><th>Books</th><th>Note</th></tr></thead>
          <tbody>{quotes.map((q,i)=><tr key={i}><td title={when(q.at)}>{ago(q.at)}</td><td>{q.visitor}</td><td>{q.school}</td><td><a href={"https://wa.me/"+String(q.phone||"").replace(/\D/g,"").replace(/^0/,"92")} target="_blank" rel="noreferrer">{q.phone}</a></td>
            <td style={{fontSize:12}}>{Array.isArray(q.items)?q.items.map(x=>x.title||x.name||x).join(", "):String(q.items||"")}</td><td style={{fontSize:12,color:'var(--muted)'}}>{q.note||""}</td></tr>)}
            {quotes.length===0 && <tr><td colSpan={6} className="empty-row">No quote requests yet.</td></tr>}</tbody></table>
        <p className="hint">Tap a phone number to open WhatsApp. These are warm leads — schools that browsed the books and asked for prices.</p>
      </div>
      <div className="card"><h3>Books opened · {t.views_all||0} in total</h3>
        <table className="gtable"><thead><tr><th>When</th><th>Visitor</th><th>School</th><th>Book</th></tr></thead>
          <tbody>{views.map((v,i)=><tr key={i}><td title={when(v.at)}>{ago(v.at)}</td><td>{v.visitor}</td><td>{v.school}</td><td>{v.book}</td></tr>)}
            {views.length===0 && <tr><td colSpan={4} className="empty-row">Nobody has opened a sample yet.</td></tr>}</tbody></table>
      </div>
    </div>}
   </div>
  );
}

/* ---------- ACCOUNTS — daily expenses & monthly books ---------- */
const EXP_CATS=["Salaries","Rent","Utilities (electricity, gas, water)","Internet & phone","Stationery & printing","Books & supplies",
  "Maintenance & repairs","Transport & fuel","Food & refreshments","Events & functions","Marketing","Other"];
const PAY_METHODS=["Cash","Bank transfer","JazzCash","EasyPaisa","Cheque"];
/* older fee payments only stored a display date ("5 Jul 2026") — read it back */
function payIso(p){ if(p.iso) return p.iso; const d=new Date(p.date); return isNaN(d.getTime())?"":d.toISOString().slice(0,10); }
function monthName(ym){ return new Date(ym+"-15T12:00").toLocaleDateString("en-GB",{month:"long",year:"numeric"}); }

function Accounts({schoolName,user}){
  const [expenses,setExpenses]=useLS("acc:expenses",[]);
  const [month,setMonth]=useState(todayISO().slice(0,7));
  const [catFilter,setCatFilter]=useState("All");
  const [ef,setEf]=useState({date:todayISO(),cat:EXP_CATS[0],desc:"",amount:"",method:"Cash",payee:""});
  const payments=LS.get("sms:payments",[]);
  const staff=LS.get("sms:staff",[]).filter(x=>!x.left);
  const isAdmin=user.role==="admin";

  const inMonth=e=>(e.date||"").slice(0,7)===month;
  const monthExp=expenses.filter(inMonth).sort((a,b)=>(b.date+String(b.id)).localeCompare(a.date+String(a.id)));
  const shown=monthExp.filter(e=>catFilter==="All"||e.cat===catFilter);
  const totalExp=monthExp.reduce((a,e)=>a+(+e.amount||0),0);
  const monthPay=payments.filter(p=>payIso(p).slice(0,7)===month);
  const income=monthPay.reduce((a,p)=>a+(+p.amount||0),0);
  const net=income-totalExp;
  const byCat=EXP_CATS.map(c=>[c,monthExp.filter(e=>e.cat===c).reduce((a,e)=>a+(+e.amount||0),0)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  const catMax=byCat.length?byCat[0][1]:1;
  const todayExp=expenses.filter(e=>e.date===todayISO()).reduce((a,e)=>a+(+e.amount||0),0);

  const addExpense=()=>{
    const amt=+ef.amount||0; if(!ef.desc.trim()&&!ef.payee.trim()){ toast("Write what the money was spent on","⚠️"); return; }
    if(amt<=0){ toast("Enter the amount","⚠️"); return; }
    setExpenses(p=>[{id:Date.now(),date:ef.date||todayISO(),cat:ef.cat,desc:ef.desc.trim(),amount:amt,method:ef.method,payee:ef.payee.trim(),by:user.name||""},...p]);
    setEf({...ef,desc:"",amount:"",payee:""}); toast("Expense recorded — "+rupee(amt),"💸");
    if((ef.date||"").slice(0,7)!==month) setMonth((ef.date||todayISO()).slice(0,7));
  };
  const removeExpense=id=>{ setExpenses(p=>p.filter(e=>e.id!==id)); toast("Entry removed","🗑️"); };
  /* one click books every active staff member's salary for the month */
  const paySalaries=()=>{
    const done=new Set(monthExp.filter(e=>e.cat==="Salaries"&&e.staffId).map(e=>e.staffId));
    const due=staff.filter(x=>!done.has(x.id)&&(+x.salary||0)>0);
    if(!due.length){ toast(staff.length?"Every salary for "+monthName(month)+" is already booked":"No staff on the list yet","ℹ️"); return; }
    const total=due.reduce((a,x)=>a+(+x.salary||0),0);
    if(!confirm("Book "+due.length+" salaries for "+monthName(month)+" — "+rupee(total)+" in total?")) return;
    const d=month===todayISO().slice(0,7)?todayISO():month+"-28";
    setExpenses(p=>[...due.map((x,i)=>({id:Date.now()+i,date:d,cat:"Salaries",desc:"Salary — "+x.name+" ("+x.role+")",amount:+x.salary||0,method:"Cash",payee:x.name,staffId:x.id,by:user.name||""})),...p]);
    toast(due.length+" salaries booked","💸");
  };
  const esc=x=>String(x==null?"":x).replace(/</g,"&lt;");
  const exportCSV=()=>downloadCSV("Expenses_"+month+".csv",
    [["Date","Category","Description","Payee","Amount","Paid via","Recorded by"],
     ...monthExp.map(e=>[e.date,e.cat,e.desc,e.payee||"",e.amount,e.method,e.by||""])]);
  const printStatement=()=>printHTML("Accounts "+month,
    `<style>.sum td{font-size:13.5px}.sum td.lb{width:220px;background:#f4f7fc;color:#5b657e;font-weight:700}
      .pos{color:#00734f;font-weight:800}.neg{color:#c1223c;font-weight:800}</style>
     <h1>${esc(schoolName)}</h1><div class="sub">Monthly Accounts — ${monthName(month)}</div>
     <table class="sum"><tr><td class="lb">Fee income received</td><td>${rupee(income)} <span style="color:#889;font-size:11px">(${monthPay.length} payments)</span></td></tr>
       <tr><td class="lb">Total expenses</td><td>${rupee(totalExp)} <span style="color:#889;font-size:11px">(${monthExp.length} entries)</span></td></tr>
       <tr><td class="lb">Net for the month</td><td class="${net>=0?"pos":"neg"}">${net>=0?"+":"−"} ${rupee(Math.abs(net))}</td></tr></table>
     <h1 style="font-size:15px;margin-top:18px">Spending by category</h1>
     <table><tr><th>Category</th><th>Amount</th><th>Share</th></tr>
     ${byCat.map(([c,v])=>`<tr><td>${esc(c)}</td><td>${rupee(v)}</td><td>${totalExp?Math.round(v/totalExp*100):0}%</td></tr>`).join("")||"<tr><td colspan=3>No expenses recorded</td></tr>"}</table>
     <h1 style="font-size:15px;margin-top:18px">Expense ledger</h1>
     <table><tr><th>Date</th><th>Category</th><th>Description</th><th>Payee</th><th>Via</th><th>Amount</th></tr>
     ${[...monthExp].reverse().map(e=>`<tr><td>${niceDate(e.date)}</td><td>${esc(e.cat)}</td><td>${esc(e.desc)}</td><td>${esc(e.payee||"—")}</td><td>${esc(e.method)}</td><td>${rupee(e.amount)}</td></tr>`).join("")}
     <tr><th colspan=5>Total</th><th>${rupee(totalExp)}</th></tr></table>
     <p style="font-size:11px;color:#98a1b5;margin-top:12px">Fee income is taken from payments recorded under School Management → Fees. Printed ${niceDate(todayISO())}.</p>`);

  return (
   <div>
    <div className="page-head"><h2>💵 Accounts</h2>
      <p>Record what the school spends each day, and see it against the fees that came in. Every entry saves on this laptop and in your cloud backup.</p></div>
    <div className="card-flex" style={{marginBottom:16}}>
      <h3 style={{marginBottom:0,color:'var(--brand)',fontSize:15,fontWeight:800}}>{monthName(month)}</h3>
      <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
        <input type="month" className="date-inp" value={month} max={todayISO().slice(0,7)} onChange={e=>setMonth(e.target.value)}/>
        <button className="mini-btn ghost" data-paysal onClick={paySalaries} title="Book every staff member's salary for this month in one go">👩‍🏫 Book staff salaries</button>
        <button className="mini-btn ghost" onClick={printStatement}>🖨️ Monthly statement</button>
        <button className="mini-btn ghost" onClick={exportCSV}>📥 CSV</button>
      </div>
    </div>
    <div className="kpi-grid">
      <div className="kpi green"><div className="ic">💰</div><div className="v">{rupee(income)}</div><div className="l">Fee income this month</div></div>
      <div className="kpi red"><div className="ic">💸</div><div className="v" data-exptotal>{rupee(totalExp)}</div><div className="l">Expenses this month</div></div>
      <div className={"kpi "+(net>=0?"green":"red")}><div className="ic">{net>=0?"📈":"📉"}</div><div className="v">{net<0?"− ":""}{rupee(Math.abs(net))}</div><div className="l">{net>=0?"Left over":"Short"} this month</div></div>
      <div className="kpi gold"><div className="ic">📅</div><div className="v">{rupee(todayExp)}</div><div className="l">Spent today</div></div>
    </div>

    <div className="card">
      <h3>💸 Record an expense</h3>
      <div className="det-grid" style={{gridTemplateColumns:"repeat(4,1fr)"}}>
        <div className="field"><label>Date</label><input type="date" data-edate value={ef.date} max={todayISO()} onChange={e=>setEf({...ef,date:e.target.value})}/></div>
        <div className="field"><label>Category</label>
          <select data-ecat value={ef.cat} onChange={e=>setEf({...ef,cat:e.target.value})}>{EXP_CATS.map(c=><option key={c}>{c}</option>)}</select></div>
        <div className="field"><label>Amount (Rs)</label><input type="number" data-eamt placeholder="0" value={ef.amount} onChange={e=>setEf({...ef,amount:e.target.value})} onKeyDown={e=>e.key==='Enter'&&addExpense()}/></div>
        <div className="field"><label>Paid via</label>
          <select value={ef.method} onChange={e=>setEf({...ef,method:e.target.value})}>{PAY_METHODS.map(m=><option key={m}>{m}</option>)}</select></div>
        <div className="field" style={{gridColumn:"span 2"}}><label>What was it for?</label>
          <input data-edesc placeholder="e.g. Electricity bill for August · 5 reams of paper · plumber for the washroom" value={ef.desc} onChange={e=>setEf({...ef,desc:e.target.value})} onKeyDown={e=>e.key==='Enter'&&addExpense()}/></div>
        <div className="field"><label>Paid to (optional)</label>
          <input data-epayee placeholder="e.g. LESCO, Ahmed Stationers" value={ef.payee} onChange={e=>setEf({...ef,payee:e.target.value})} onKeyDown={e=>e.key==='Enter'&&addExpense()}/></div>
        <div className="field" style={{display:'flex',alignItems:'flex-end'}}><button className="add-btn" data-eadd style={{width:'100%'}} onClick={addExpense}>＋ Record expense</button></div>
      </div>
      <p className="hint">Tip: press Enter in any box to save. Salaries can be booked for everyone at once with the button at the top.</p>
    </div>

    {byCat.length>0 && <div className="card">
      <h3>Where the money went · {monthName(month)}</h3>
      {byCat.map(([c,v])=><div key={c} className="cat-row">
        <div className="cat-lb">{c}</div>
        <div className="cat-bar"><div className="cat-fill" style={{width:Math.max(3,Math.round(v/catMax*100))+"%"}}></div></div>
        <div className="cat-v">{rupee(v)} <span>· {totalExp?Math.round(v/totalExp*100):0}%</span></div>
      </div>)}
    </div>}

    <div className="card">
      <div className="card-flex"><h3>Expense ledger · {shown.length}</h3>
        <div className="filter-bar" style={{margin:0}}>{["All",...byCat.map(x=>x[0])].map(c=><span key={c} className={"fchip"+(catFilter===c?" active":"")} onClick={()=>setCatFilter(c)}>{c.split(" (")[0]}</span>)}</div></div>
      <table className="gtable"><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Paid to</th><th>Via</th><th>Amount</th><th></th></tr></thead>
        <tbody>{shown.map(e=><tr key={e.id}><td style={{whiteSpace:'nowrap'}}>{niceDate(e.date)}</td><td>{e.cat.split(" (")[0]}</td><td>{e.desc||<span style={{color:'var(--muted)'}}>—</span>}</td><td>{e.payee||"—"}</td><td>{e.method}</td>
          <td><b style={{color:'var(--red)'}}>{rupee(e.amount)}</b></td>
          <td>{isAdmin && <button className="del-btn" title="Remove this entry" onClick={()=>removeExpense(e.id)}>✕</button>}</td></tr>)}
          {shown.length===0 && <tr><td colSpan={7} className="empty-row">{monthExp.length===0?"Nothing recorded for "+monthName(month)+" yet — add the first expense above.":"No entries in this category."}</td></tr>}
          {shown.length>0 && <tr className="rc-total"><td colSpan={5}><b>Total{catFilter!=="All"?" · "+catFilter.split(" (")[0]:""}</b></td><td><b>{rupee(shown.reduce((a,e)=>a+(+e.amount||0),0))}</b></td><td></td></tr>}
        </tbody></table>
      <p className="hint">Fee income comes from payments recorded under School Management → Fees, so the two sides of the month stay in step without double entry.</p>
    </div>
   </div>
  );
}

/* ---------- PROFILE & SETTINGS ---------- */
function Profile({user,theme,setTheme,schoolName,setSchoolName}){
  const fileRef=useRef(null);
  const isAdmin=user.role==="admin";
  const doImport=e=>{ const f=e.target.files[0]; if(!f)return;
    importBackup(f,ok=>{ if(ok){toast("Backup restored — reloading","💾"); setTimeout(()=>location.reload(),900);} else toast("That file isn't a valid AzharEd backup","⚠️"); });
    e.target.value=""; };
  const resetAll=()=>{ if(!confirm("Reset ALL saved data on this device (gradebook, fees, attendance, favourites…)? This cannot be undone."))return;
    LS.keys().forEach(k=>LS.del(k)); location.reload(); };
  return (
   <div>
    <div className="page-head"><h2>👤 Profile &amp; Settings</h2></div>
    <div className="card" style={{maxWidth:560}}>
      <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:16}}>
        <div className="avatar" style={{width:54,height:54,fontSize:18,background:user.role==='admin'?'#e94560':'#00a884'}}>{initials(user.name)}</div>
        <div><div style={{fontWeight:800,fontSize:17,color:'var(--brand)'}}>{user.name}</div>
          <div style={{color:'var(--muted)',fontSize:13,textTransform:'capitalize'}}>{user.role} · {schoolName}</div></div>
      </div>
      <div className="field"><label>Email</label><input defaultValue={user.email} readOnly/></div>
      <div className="field"><label>School name (used on receipts, report cards &amp; printouts)</label>
        <input value={schoolName} onChange={e=>setSchoolName(e.target.value)}/></div>
    </div>
    <div className="card" style={{maxWidth:560}}>
      <h3>⚙️ Appearance</h3>
      <div className="setting-row">
        <div><div className="st">🌙 Dark mode</div><div className="sd">Easier on the eyes in dim classrooms — your choice is remembered.</div></div>
        <div className={"switch"+(theme==="dark"?" on":"")} onClick={()=>setTheme(theme==="dark"?"light":"dark")}><div className="knob"></div></div>
      </div>
    </div>
    <div className="card" style={{maxWidth:560}}>
      <h3>📦 Storage on this device</h3>
      {(()=>{ const used=storageBytes(), cap=5*1024*1024, pctUsed=Math.min(100,used/cap*100);
        const stu=LS.get("sms:students",[]), stf=LS.get("sms:staff",[]);
        const photos=[...stu,...stf].filter(x=>x.photo).length;
        return (<div>
          <div className="stat-flex">
            <Ring pct={pctUsed} size={64} stroke={6} label={pctUsed<1?"<1%":Math.round(pctUsed)+"%"}/>
            <p style={{flex:1,fontSize:12.5,color:'var(--muted)',lineHeight:1.6}}><b style={{color:'var(--text)'}}>{(used/1024).toFixed(0)} KB used</b> of ~5,000 KB available<br/>{stu.length} students · {stf.length} staff · {photos} photos</p>
          </div>
          <p className="hint">Records are tiny — there's room for <b>thousands of students and staff</b>. Photos are auto-compressed to roughly 8 KB each, so around <b>500+ people with photos</b> fit comfortably. If the bar ever fills up, download a backup and remove unused photos.</p>
        </div>); })()}
    </div>
    <CloudCard user={user}/>
    <div className="card" style={{maxWidth:560}}>
      <h3>💾 Your data</h3>
      <p style={{fontSize:12.5,color:'var(--muted)',marginBottom:14,lineHeight:1.6}}>Gradebook marks, fees, attendance, timetables, favourites and progress are saved in this browser on this device. Download a backup regularly, and restore it on any other device to move your data across.</p>
      <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
        <button className="btn btn-navy" onClick={exportBackup}>⬇️ Download backup</button>
        {isAdmin && <button className="btn btn-outline" onClick={()=>fileRef.current.click()}>⬆️ Restore backup</button>}
        {isAdmin && <button className="btn btn-danger" onClick={resetAll}>🗑️ Reset all data</button>}
        <input ref={fileRef} type="file" accept="application/json" style={{display:'none'}} onChange={doImport}/>
      </div>
      {!isAdmin && <p className="hint" style={{marginTop:12}}>🔒 Restoring a backup and resetting the device replace every record, so they are limited to the school's admin account.</p>}
    </div>
   </div>
  );
}

/* ---------- APP ---------- */
function App(){
  const SESSION_V=4;   /* bump this number + redeploy to force-logout every existing session */
  const [user,setUser]=useLS("session",null);
  useEffect(()=>{ if(user && user.sv!==SESSION_V) setUser(null); },[user]);
  const [page,setPage]=useState("dashboard");
  const [navOpen,setNavOpen]=useState(false);
  const [theme,setTheme]=useLS("theme","light");
  const [searchOpen,setSearchOpen]=useState(false);
  const [appBook,setAppBook]=useState(null);
  const [focusBook,setFocusBook]=useState(null);
  const [rcPrefill,setRcPrefill]=useState(null);
  const [favs,setFavs]=useLS("favs",[]);
  const [students,setStudents]=useLS("sms:students",SEED_STUDENTS);
  const [notices,setNotices]=useLS("sms:notices",SEED_NOTICES);
  const [schoolName,setSchoolName]=useLS("schoolName","Azhar Model School");
  const [lang,setLang]=useLS("lang","en");
  LANGV=lang;
  /* quiet once-a-day cloud backup, a few seconds after the app settles */
  useEffect(()=>{ if(!user||!user.cloud) return;
    const t=setTimeout(()=>{ maybeAutoBackup(user); }, 12000);
    return ()=>clearTimeout(t); },[user]);
  useEffect(()=>{ document.documentElement.dataset.theme=theme; },[theme]);
  useEffect(()=>{ document.documentElement.lang=lang==="ur"?"ur":"en"; },[lang]);
  /* Pro runs without its own service worker */
  useEffect(()=>{
    const h=e=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); setSearchOpen(o=>!o); }
      if(e.key==="Escape") setSearchOpen(false); };
    window.addEventListener("keydown",h); return ()=>window.removeEventListener("keydown",h);
  },[]);
  if(!user || user.sv!==SESSION_V) return <div><Auth onLogin={u=>{const {password,...safe}=u;setUser({...safe,sv:SESSION_V});setPage("dashboard");toast("Welcome, "+u.name.split(" ").slice(-1)+"!","👋");}}/><Toasts/></div>;
  const go=p=>{ setPage(p); setNavOpen(false); if(p!=="reportcards") setRcPrefill(null); };
  const goReport=data=>{ setRcPrefill(data); setPage("reportcards"); toast("Report card pre-filled for "+data.student,"🧾"); };
  const nav=[
    {section:"Main"},
    {id:"dashboard",label:"Dashboard",icon:"🏠"},
    {id:"library",label:"Book Library",icon:"📚"},
    {section:"Teaching"},
    {id:"papergen",label:"Paper Generator",icon:"📝"},
    {id:"planner",label:"Lesson Planner",icon:"🗓️"},
    {id:"diary",label:"Homework Diary",icon:"📔"},
    {id:"certs",label:"Certificates",icon:"🏅"},
    {id:"training",label:"Teacher Training",icon:"🎓"},
    {id:"gradebook",label:"Class Gradebook",icon:"📊"},
    {id:"reportcards",label:"Report Cards",icon:"🧾"},
    ...(user.role==='admin'?[{section:"Administration"},{id:"admin",label:"School Management",icon:"🏫"},{id:"accounts",label:"Accounts",icon:"💵"}]:[]),
    ...(user.owner?[{section:"Azhar Publishers"},{id:"owner",label:"Owner dashboard",icon:"🏢"}]:[]),
    {section:"Account"},
    {id:"profile",label:"Profile & Settings",icon:"👤"},
  ];
  const titles={dashboard:"Dashboard",library:"Book Library",papergen:"Paper Generator",planner:"Lesson Planner",diary:"Homework Diary",certs:"Certificates",training:"Teacher Training",gradebook:"Class Gradebook",reportcards:"Report Cards",admin:"School Management",accounts:"Accounts",owner:"Owner dashboard",profile:"Profile & Settings"};
  const render=()=>({
    dashboard:<Dashboard user={user} go={go} openBook={setAppBook} notices={notices}/>,
    library:<Library openBook={setAppBook} favs={favs} setFavs={setFavs} onFocus={setFocusBook}/>,
    papergen:<PaperGen schoolName={schoolName} openBook={setAppBook}/>,
    planner:<Planner schoolName={schoolName} openBook={setAppBook}/>,
    diary:<Diary schoolName={schoolName}/>,
    certs:<Certificates students={students} schoolName={schoolName}/>,
    training:<Training user={user}/>,
    gradebook:<Gradebook students={students} goReport={goReport}/>,
    reportcards:<ReportCard prefill={rcPrefill} students={students} schoolName={schoolName}/>,
    admin:<AdminSMS students={students} setStudents={setStudents} notices={notices} setNotices={setNotices} schoolName={schoolName}/>,
    accounts:<Accounts schoolName={schoolName} user={user}/>,
    owner:user.owner?<OwnerDash user={user}/>:<Dashboard user={user} go={go} openBook={setAppBook} notices={notices}/>,
    profile:<Profile user={user} theme={theme} setTheme={setTheme} schoolName={schoolName} setSchoolName={setSchoolName}/>
  }[page]||<Dashboard user={user} go={go} openBook={setAppBook} notices={notices}/>);
  return (
   <div className="shell">
    <div className={"sb-backdrop"+(navOpen?" show":"")} onClick={()=>setNavOpen(false)}></div>
    <div className={"sb"+(navOpen?" open":"")}>
      <div className="sb-logo"><img src={LOGO_AZHAR} alt="Azhar Publishers"/><div className="mark">MAKTA<span>B</span> <span style={{color:"var(--gold)",fontSize:16}}>مکتب</span></div><p>Azhar Publishers · Book Factory</p></div>
      <nav className="sb-nav">
        {nav.map((it,i)=> it.section
          ? <div key={i} className="sb-sec">{t(it.section)}</div>
          : <div key={it.id} className={"sb-item"+(page===it.id?" active":"")} onClick={()=>go(it.id)}><span className="si">{it.icon}</span>{t(it.label)}</div>)}
      </nav>
      <div className="sb-foot">
        <div className="sb-user">
          <div className="avatar" style={{background:user.role==='admin'?'#e94560':'#00a884'}}>{initials(user.name)}</div>
          <div><div className="name">{user.name}</div><div className="role">{user.role}</div></div>
        </div>
        <div className="sb-logout" onClick={()=>{ if(user&&user.cloud&&window.SB){ try{SB.auth.signOut();}catch(e){} } setUser(null); }}>↩ {t("Sign out")}</div>
      </div>
    </div>
    <div className="content-area">
      <div className="topbar">
        <div className="topbar-left"><button className="hamburger" onClick={()=>setNavOpen(o=>!o)} aria-label="Menu">☰</button><h1>{t(titles[page])}</h1></div>
        <div className="topbar-right">
          <div className="searchbox" onClick={()=>setSearchOpen(true)}>🔍 <span>{t("Search books, papers…")}</span><kbd>Ctrl K</kbd></div>
          <button className="icon-btn" style={{width:'auto',padding:'0 10px',fontSize:12,fontWeight:800}} title="اردو / English" onClick={()=>setLang(lang==="ur"?"en":"ur")}>{lang==="ur"?"EN":"اردو"}</button>
          <button className="icon-btn" title="Toggle dark mode" onClick={()=>setTheme(theme==="dark"?"light":"dark")}>{theme==="dark"?"☀️":"🌙"}</button>
          <span className="role-badge">{t(user.role)}</span>
        </div>
      </div>
      <div className="main">{render()}</div>
    </div>
    {appBook && <BookModal book={appBook} onClose={()=>setAppBook(null)} favs={favs} setFavs={setFavs} onFocus={setFocusBook}/>}
    {focusBook && <FocusMode book={focusBook} onClose={()=>setFocusBook(null)}/>}
    {searchOpen && <SearchModal onClose={()=>setSearchOpen(false)} onOpenBook={b=>setAppBook(b)} go={go}/>}
    <Toasts/>
   </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
