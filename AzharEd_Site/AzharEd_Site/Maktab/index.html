<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eef2f8; --surface:#ffffff; --surface2:#f5f7fc; --text:#17203a; --muted:#7c8499;
  --border:#e4e8f1; --navy:#0f3460; --navy2:#1a4a8a; --brand:#0f3460; --red:#e94560;
  --gold:#F0A500; --green:#00a884; --blue:#2f6fed; --shadow:rgba(20,35,70,.08);
  --sb:#0f3460; --sb2:#0b2748; --input:#ffffff; --chipbg:#eef2fb;
}
[data-theme="dark"]{
  --bg:#0c1322; --surface:#151f36; --surface2:#1b2745; --text:#e8ecf7; --muted:#93a2c2;
  --border:#27345a; --navy:#2f6fed; --navy2:#4a83f2; --brand:#9db9ff; --shadow:rgba(0,0,0,.35);
  --sb:#0a1020; --sb2:#070b16; --input:#101a30; --chipbg:#1d2a4c;
}
html{scroll-behavior:smooth}
body{font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
h1,h2,h3,.mark,.rc-badge{font-family:'Baloo 2','Nunito',sans-serif}
input,select,textarea,button{font-family:inherit}
::selection{background:rgba(47,111,237,.25)}

/* ===== AUTH ===== */
.auth-wrap{min-height:100vh;display:flex;background:linear-gradient(135deg,#0f3460 0%,#16213e 60%,#1a1a2e 100%)}
.auth-left,.auth-right{flex:1;display:flex;align-items:center;justify-content:center;padding:48px}
.auth-brand{color:#fff;max-width:470px}
.auth-brand .mark{font-size:46px;font-weight:800;line-height:1;margin-bottom:18px}
.auth-brand .mark span{color:var(--red)}
.auth-brand h1{font-size:29px;font-weight:800;line-height:1.25;margin-bottom:14px}
.auth-brand p{font-size:15px;opacity:.75;line-height:1.7;margin-bottom:24px}
.auth-card{background:#fff;border-radius:22px;padding:38px;width:100%;max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,.35);color:#17203a}
.auth-card h2{font-size:24px;font-weight:800;color:#0f3460;text-align:center}
.auth-card h2 span{color:var(--red)}
.auth-card .sub{color:#8a90a0;font-size:13px;text-align:center;margin:4px 0 22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{width:100%;padding:11px 14px;border:2px solid var(--border);border-radius:10px;font-size:14px;outline:none;transition:border .2s;background:var(--input);color:var(--text)}
.field textarea{resize:vertical;line-height:1.5}
.auth-card .field input{background:#fff;color:#17203a;border-color:#e8e8e8}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--navy)}
.btn-primary{width:100%;padding:13px;background:linear-gradient(135deg,#0f3460,#1a4a8a);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;transition:all .2s}
.btn-primary:hover{filter:brightness(1.15);transform:translateY(-1px)}
.demo{margin-top:16px;background:#f6f8fd;border-radius:10px;padding:12px}
.demo p{font-size:10.5px;font-weight:800;color:#8a90a0;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #e0e4ee;border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;margin:3px 4px 0 0;transition:all .15s;color:#17203a}
.chip:hover{border-color:#0f3460;color:#0f3460}
.chip .dot{width:7px;height:7px;border-radius:50%}
.err{background:#fff0f3;border:1px solid #ffc0cb;border-radius:8px;padding:9px 13px;color:#c0392b;font-size:13px;margin-bottom:13px}
.logo-bar{background:#fff;border-radius:14px;padding:12px 18px;display:inline-flex;align-items:center;gap:16px;margin-bottom:24px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.logo-bar img{height:34px;width:auto;display:block}
.logo-bar .divider{width:1px;height:32px;background:#e2e5ee}
.auth-feat{display:flex;align-items:center;gap:12px;margin-bottom:12px;color:rgba(255,255,255,.87);font-size:14px}
.auth-feat .fi{width:34px;height:34px;background:rgba(233,69,96,.22);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}

/* ===== SHELL ===== */
.shell{display:flex;height:100vh;overflow:hidden}
.sb{width:238px;min-width:238px;background:linear-gradient(180deg,var(--sb),var(--sb2));display:flex;flex-direction:column;height:100vh;overflow-y:auto}
.sb-logo{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo img{height:26px;background:#fff;border-radius:6px;padding:4px 7px;display:block;margin-bottom:9px}
.sb-logo .mark{font-size:23px;font-weight:800;color:#fff}
.sb-logo .mark span{color:var(--red)}
.sb-logo p{font-size:10px;color:rgba(255,255,255,.42);margin-top:3px;letter-spacing:.3px}
.sb-nav{flex:1;padding:8px 0}
.sb-sec{padding:12px 18px 4px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.32)}
.sb-item{display:flex;align-items:center;gap:11px;padding:10px 18px;cursor:pointer;font-size:13.5px;color:rgba(255,255,255,.72);border-left:3px solid transparent;transition:all .15s}
.sb-item:hover{background:rgba(255,255,255,.06);color:#fff}
.sb-item.active{background:rgba(255,255,255,.1);border-left-color:var(--red);color:#fff;font-weight:700}
.sb-item .si{font-size:16px;width:20px;text-align:center}
.sb-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08)}
.sb-user{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0}
.sb-user .name{font-size:13px;font-weight:700;color:#fff}
.sb-user .role{font-size:11px;color:rgba(255,255,255,.45);text-transform:capitalize}
.sb-logout{font-size:12px;color:var(--red);cursor:pointer;font-weight:700}
.sb-logout:hover{opacity:.8}

/* ===== TOPBAR & CONTENT ===== */
.content-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--surface);padding:0 20px 0 24px;height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);flex-shrink:0}
.topbar h1{font-size:17px;font-weight:800;color:var(--brand)}
.topbar-right{display:flex;align-items:center;gap:10px}
.role-badge{background:var(--chipbg);color:var(--brand);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:800;text-transform:capitalize;white-space:nowrap}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.icon-btn:hover{border-color:var(--navy);color:var(--brand)}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:7px 12px;font-size:13px;color:var(--muted);cursor:pointer;min-width:200px;transition:border .15s}
.searchbox:hover{border-color:var(--navy)}
.searchbox kbd{margin-left:auto;font-size:10px;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--muted)}
.main{flex:1;overflow-y:auto;padding:34px 32px 80px}
.main>div{max-width:1150px;margin:0 auto}
.page-head{margin-bottom:28px}
.page-head h2{font-size:23px;font-weight:800;color:var(--brand)}
.page-head p{color:var(--muted);font-size:13.5px;margin-top:4px}

/* ===== STATS / KPI / CARDS ===== */
.stats{display:grid;gap:15px;grid-template-columns:repeat(4,1fr);margin-bottom:24px}
.stat{background:var(--surface);border-radius:16px;padding:18px 20px;box-shadow:0 1px 5px var(--shadow);border:1px solid var(--border);transition:transform .15s}
.stat:hover{transform:translateY(-2px)}
.stat .ic{font-size:22px;margin-bottom:8px}
.stat .v{font-size:26px;font-weight:900;color:var(--brand)}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.card{background:var(--surface);border-radius:18px;padding:24px 26px;box-shadow:0 1px 5px var(--shadow);border:1px solid var(--border);margin-bottom:24px}
.card h3{font-size:15px;font-weight:800;color:var(--brand);margin-bottom:12px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--surface);border-radius:14px;padding:15px 18px;box-shadow:0 1px 5px var(--shadow);border:1px solid var(--border);border-left:4px solid var(--navy)}
.kpi .ic{font-size:19px}
.kpi .v{font-size:22px;font-weight:900;color:var(--brand);margin-top:5px;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted);margin-top:3px}
.kpi.green{border-left-color:var(--green)}.kpi.gold{border-left-color:var(--gold)}.kpi.red{border-left-color:var(--red)}

/* ===== FILTERS / CHIPS ===== */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.filter-bar .lbl{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-right:2px}
.fchip{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.fchip.active,.fchip:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.fchip.star.active{background:var(--gold);border-color:var(--gold);color:#1a1a2e}
.mini{font-size:10px;font-weight:800;padding:3px 7px;border-radius:6px;background:var(--chipbg);color:var(--brand)}

/* ===== BOOK GRID ===== */
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:18px}
.shelf-div{display:flex;align-items:center;gap:12px;margin:26px 0 14px;font-weight:900;font-size:15px}
.shelf-div:first-of-type{margin-top:4px}
.shelf-div i{flex:1;height:2px;background:var(--border);border-radius:2px}
.shelf-div em{font-style:normal;font-size:12px;font-weight:700;color:var(--muted)}
.book-card{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:0 2px 8px var(--shadow);transition:transform .18s,box-shadow .18s;cursor:pointer;border:1px solid var(--border);position:relative}
.book-card:hover{transform:translateY(-5px);box-shadow:0 16px 36px var(--shadow)}
.book-cover{aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;position:relative;padding:12px 14px 10px;text-align:center;border-bottom:4px solid rgba(0,0,0,.18)}
.bc-top{width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.book-cover .bl{background:rgba(255,255,255,.95);color:#0f1f3d;font-size:9px;font-weight:900;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
.bc-age{font-size:9.5px;font-weight:700;color:rgba(255,255,255,.85)}
.book-cover .bi{font-size:40px;margin:8px 0 6px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}
.bc-title{font-size:15.5px;font-weight:800;line-height:1.22;text-shadow:0 1px 4px rgba(0,0,0,.28);padding:0 4px}
.bc-level{font-size:12px;font-weight:600;color:rgba(255,255,255,.92);margin-top:5px;background:rgba(0,0,0,.16);padding:2px 12px;border-radius:20px}
.bc-pub{margin-top:auto;font-size:8.5px;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.72);font-weight:700;padding-top:8px}
.book-info{padding:11px 13px 13px}
.book-info .m{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.book-info .t{font-size:13.5px;font-weight:800;color:var(--text);line-height:1.3;margin-bottom:3px}
.book-info .tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.book-cover-img{position:relative;aspect-ratio:3/4;background:var(--surface2);overflow:hidden;border-bottom:4px solid rgba(0,0,0,.1)}
.book-cover-img img{width:100%;height:100%;object-fit:cover;display:block}
.book-cover-img .bl{position:absolute;top:9px;left:9px;background:rgba(255,255,255,.95);color:#0f1f3d;font-size:9px;font-weight:900;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
.star-btn{position:absolute;top:8px;right:8px;z-index:5;width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.92);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.22);transition:transform .15s}
.star-btn:hover{transform:scale(1.15)}
.modal-cover{height:98px;width:auto;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.32);display:block}

/* ===== MODAL ===== */
.overlay{position:fixed;inset:0;background:rgba(10,18,38,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(3px);animation:fadeIn .18s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal{background:var(--surface);border-radius:20px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 32px 64px rgba(0,0,0,.35);animation:popIn .2s}
.modal-top{padding:0;position:relative}
.modal-hero{height:130px;display:flex;align-items:center;gap:16px;padding:0 26px;color:#fff}
.modal-hero .bi{font-size:46px}
.modal-hero h3{font-size:20px;font-weight:800}
.modal-hero p{font-size:13px;opacity:.9;margin-top:3px}
.modal-x{position:absolute;top:14px;right:16px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.25);color:#fff;border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-body{padding:22px 26px 26px}
.med-flag{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:6px;border-radius:50%;background:#fdecef;color:#e94560;font-size:11px;font-weight:800;cursor:help;flex:none}
.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.det-grid .full{grid-column:1 / -1}
.det-grid .field{margin:0}
.det-note{background:#fdecef;border:1px solid #f7ccd6;border-radius:9px;padding:9px 12px;font-size:12px;color:#a82340;line-height:1.5;margin-top:2px}
.det-age{font-size:11.5px;color:var(--muted);margin-top:4px}
.det-foot{display:flex;gap:9px;margin-top:18px;align-items:center}
.det-foot .btn-primary{flex:1}
.empty-row{text-align:center;color:var(--muted);font-size:13px;padding:26px 14px!important;line-height:1.6}
.alert-card{border-left:4px solid var(--red)}
.tt-clash{background:#fdecef!important;color:#c1223c;font-weight:800}
.tt-free{color:#b6bccb}
.notice-item.urgent{border-left:3px solid var(--red);padding-left:10px}
.sched-tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:20px;background:#eef2fb;color:#5b657e;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.disc-tag{display:inline-block;margin-left:7px;padding:1px 7px;border-radius:20px;background:#e8f7f0;color:#00875f;font-size:10.5px;font-weight:800;vertical-align:middle}
.streak-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:13.5px;flex-wrap:wrap}
.streak-row:last-child{border-bottom:none}
.act-list{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.act2{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:13px;border:1px solid var(--border);border-left:4px solid #ccc;background:var(--surface);cursor:pointer;text-align:left;transition:all .16s;width:100%;color:var(--text)}
.act2:hover{box-shadow:0 8px 20px var(--shadow);transform:translateY(-1px)}
.act2 .a2i{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0}
.act2 .a2b{flex:1}
.act2 .a2t{font-size:14.5px;font-weight:800;color:var(--brand)}
.act2 .a2d{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.act2 .a2go{font-size:12px;font-weight:800;color:var(--brand);white-space:nowrap;opacity:.7}
.act2:hover .a2go{opacity:1}
.act2.flip{border-left-color:var(--blue)}.act2.flip .a2i{background:var(--chipbg)}
.act2.inter{border-left-color:var(--green)}.act2.inter .a2i{background:var(--chipbg)}
.act2.teach{border-left-color:var(--gold)}.act2.teach .a2i{background:var(--chipbg)}
.act2.disabled{opacity:.42;cursor:not-allowed}
.act2.disabled:hover{box-shadow:none;transform:none}
.papers-h{font-size:12px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.paper-row{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border:1px solid var(--border);border-radius:9px;margin-bottom:7px;cursor:pointer;transition:all .13s}
.paper-row:hover{border-color:var(--navy);background:var(--surface2)}
.paper-row .pl{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:9px}
.paper-row .po{font-size:11px;font-weight:800;color:var(--brand);display:flex;gap:10px;align-items:center}
.tick{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:transparent;flex-shrink:0;transition:all .15s;background:var(--surface)}
.tick.on{background:var(--green);border-color:var(--green);color:#fff}
.link-btn{background:none;border:none;color:var(--brand);font-size:11px;font-weight:800;cursor:pointer;text-transform:none;letter-spacing:0}
.link-btn:hover{text-decoration:underline}

/* ===== TABLES ===== */
.gtable{width:100%;border-collapse:collapse;font-size:13px}
.gtable th,.gtable td{padding:9px 12px;border:1px solid var(--border);text-align:center;color:var(--text)}
.gtable th{background:var(--navy);color:#fff;font-weight:700;font-size:12px}
.gtable td:first-child,.gtable th:first-child{text-align:left}
.gtable input{width:56px;padding:5px;border:1px solid var(--border);border-radius:6px;text-align:center;font-size:13px;background:var(--input);color:var(--text)}
.gtable tr:nth-child(even){background:var(--surface2)}
.grade-pill{font-weight:800;padding:2px 9px;border-radius:20px;font-size:12px}
.pill{display:inline-block;padding:3px 11px;border-radius:20px;font-size:11px;font-weight:800}
.pill.paid,.pill.present{background:#1e7e4522;color:#2ba55f}
.pill.pending,.pill.absent{background:#e9456022;color:#e94560}
.pill.partial,.pill.leave{background:#F0A50022;color:#c98a00}

/* ===== SMS ===== */
.sms-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:22px;border-bottom:1px solid var(--border)}
.sms-tab{padding:7px 13px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;border-radius:9px 9px 0 0;border-bottom:3px solid transparent;transition:all .15s}
.sms-tab:hover{color:var(--brand)}
.sms-tab.active{color:var(--brand);border-bottom-color:var(--red);background:var(--surface2)}
.att-btns{display:inline-flex;gap:4px}
.att-b{width:26px;height:26px;border-radius:7px;font-size:11px;font-weight:800;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--muted)}
.att-b.on-present{background:var(--green);color:#fff;border-color:var(--green)}
.att-b.on-absent{background:var(--red);color:#fff;border-color:var(--red)}
.att-b.on-leave{background:var(--gold);color:#1a1a2e;border-color:var(--gold)}
.bar-lbl{font-size:11px;color:var(--muted);font-weight:700}
.ring-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-around;padding:12px 0 6px}
.ring-item{display:flex;flex-direction:column;align-items:center;gap:8px}
.mini-btn{padding:5px 11px;border-radius:7px;font-size:11px;font-weight:800;border:none;cursor:pointer;background:var(--navy);color:#fff}
.mini-btn:hover{filter:brightness(1.15)}
.mini-btn.ghost{background:var(--surface);color:var(--brand);border:1px solid var(--border)}
.mini-btn.wa{background:#25D366;color:#fff}
.card-flex{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.card-flex h3{margin-bottom:0}
.hint{font-size:11.5px;color:var(--muted);opacity:.85;margin-top:12px;line-height:1.6}
.notice-item{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--border)}
.notice-item:last-child{border-bottom:none}
.notice-item .nd{font-size:12.5px;color:var(--muted);margin-top:3px}
.notice-item .nt{font-size:11px;color:var(--muted);white-space:nowrap;font-weight:700}
.del-btn{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--red);font-size:12px;font-weight:800;cursor:pointer;line-height:1}
.del-btn:hover{background:var(--red);color:#fff;border-color:var(--red)}
.tt-sel{padding:7px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-weight:700;background:var(--input);color:var(--brand);cursor:pointer}
.tt-table td{padding:4px}
.tt-table td:first-child{padding:9px 12px}
.tt-inp{width:100%;min-width:78px;border:1px solid transparent;background:transparent;text-align:center;font-size:12.5px;font-weight:600;padding:6px 4px;outline:none;border-radius:6px;color:var(--text)}
.tt-inp:hover{border-color:var(--border)}
.tt-inp:focus{background:var(--chipbg);border-color:var(--navy)}
.tt-cell{width:100%;min-width:96px;border:1px solid transparent;background:transparent;text-align:center;font-size:12.5px;font-weight:600;padding:6px 2px;outline:none;border-radius:6px;color:var(--text);cursor:pointer;appearance:none;-webkit-appearance:none;text-align-last:center}
.tt-cell:hover{border-color:var(--navy);background:var(--surface2)}
.tt-cell:focus{background:var(--chipbg);border-color:var(--navy)}
.tt-cell option{background:var(--surface);color:var(--text)}
.btn-sm{padding:8px 14px;font-size:12px}
.quick-add{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.quick-add input{flex:1;min-width:180px;max-width:340px;padding:8px 13px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;outline:none;background:var(--input);color:var(--text)}
.quick-add input:focus{border-color:var(--navy)}
.date-inp{padding:7px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-weight:700;background:var(--input);color:var(--text);outline:none}

/* ===== MISC ===== */
.note{background:#F0A50018;border:1px solid #F0A50055;border-radius:10px;padding:12px 15px;font-size:12.5px;color:var(--text);margin-bottom:16px;line-height:1.5}
.soon{background:var(--chipbg);color:var(--brand);font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
.btn{padding:9px 16px;border-radius:9px;font-size:13px;font-weight:800;cursor:pointer;border:none}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{filter:brightness(1.15)}
.btn-outline{background:var(--surface);border:2px solid var(--navy);color:var(--brand)}
.btn-danger{background:var(--surface);border:2px solid var(--red);color:var(--red)}
.train-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.train-card{background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px var(--shadow);border:1px solid var(--border)}
.train-thumb{height:120px;background:linear-gradient(135deg,var(--sb),#1a4a8a);display:flex;align-items:center;justify-content:center;font-size:34px;color:rgba(255,255,255,.9);position:relative;cursor:pointer}
.train-thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);font-size:40px;opacity:0;transition:opacity .2s}
.train-thumb:hover .play{opacity:1}
.train-thumb .soon2{position:absolute;bottom:8px;right:8px}
.train-b{padding:13px 14px}
.train-b .t{font-size:13px;font-weight:800;color:var(--brand)}
.train-b .d{font-size:11.5px;color:var(--muted);margin-top:3px}
.train-b input{width:100%;margin-top:8px;padding:6px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:11.5px;background:var(--input);color:var(--text);outline:none}
.video-frame{width:100%;aspect-ratio:16/9;border:none;border-radius:12px;background:#000}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty .ei{font-size:38px;margin-bottom:10px}

/* ===== RINGS / AVATARS / STORAGE ===== */
.ringwrap{position:relative;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ring-lbl{position:absolute;font-weight:900;color:var(--brand)}
.stat-flex{display:flex;align-items:center;justify-content:space-between;gap:10px}
.av-sm{border-radius:50%;object-fit:cover;display:block}
.av-btn{position:relative;cursor:pointer;border:none;background:none;padding:0;line-height:0;border-radius:50%}
.av-btn::after{content:"📷";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,20,40,.55);border-radius:50%;font-size:11px;opacity:0;transition:opacity .15s}
.av-btn:hover::after{opacity:1}
.tbl-name{display:flex;align-items:center;gap:9px}
.photo-menu{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:14px 0 4px}
.sug-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.sug-chips .lbl2{font-size:11px;font-weight:800;color:var(--muted)}
.step-n{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:800;align-items:center;justify-content:center;margin-right:9px;vertical-align:middle}
.howto{display:flex;gap:12px;align-items:flex-start;background:var(--chipbg);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:18px;font-size:13px;line-height:1.65;color:var(--text)}
.howto .hi{font-size:20px;flex-shrink:0}
.sug{padding:4px 11px;border-radius:20px;border:1.5px dashed var(--border);background:transparent;color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer;transition:all .15s}
.sug:hover{border-color:var(--green);color:var(--green);border-style:solid}

/* ===== DISCLOSURE (tuck heavy forms away) ===== */
.disc{border:1.5px dashed var(--border);border-radius:14px;margin-bottom:16px;background:transparent}
.disc summary{cursor:pointer;padding:12px 18px;font-weight:800;font-size:13px;color:var(--brand);list-style:none;display:flex;align-items:center;gap:8px}
.disc summary::-webkit-details-marker{display:none}
.disc summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:transform .2s}
.disc[open] summary::after{transform:rotate(180deg)}
.disc[open]{background:var(--surface2);border-style:solid}
.disc .disc-b{padding:2px 18px 18px}
.qa-chip{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);color:var(--brand);font-size:13px;font-weight:800;cursor:pointer;transition:all .15s}
.qa-chip:hover{border-color:var(--navy);transform:translateY(-2px);box-shadow:0 6px 16px var(--shadow)}
.sub-select{padding:6px 12px;border:1.5px solid var(--border);border-radius:20px;font-size:12px;font-weight:700;background:var(--surface);color:var(--muted);cursor:pointer;outline:none}
.sub-select:focus{border-color:var(--navy)}

/* ===== FOCUS MODE (from MAKTAB) ===== */
.fx2{position:fixed;inset:0;z-index:3000;background:radial-gradient(1000px 700px at 50% -10%,#141d3f,#070a14 70%);
  color:#eff3ff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;animation:fadeIn .35s}
.fx2 .kick2{font-size:12px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#ffb300;margin-bottom:10px}
.fx2 .kick2 b{color:#22d3ee}
.fx2 h2{font-size:clamp(28px,4.4vw,52px);color:#fff;max-width:20ch;line-height:1.1;margin-bottom:34px}
.fx2-acts{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-bottom:44px}
.fxa2{width:190px;padding:24px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.05);
  font-size:14.5px;font-weight:800;color:#fff;cursor:pointer;transition:.25s}
.fxa2 .i{font-size:36px;display:block;margin-bottom:10px}
.fxa2 small{display:block;font-weight:600;font-size:11px;color:#8a94b8;margin-top:5px}
.fxa2:hover{transform:translateY(-6px);border-color:#ffb300;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.fxa2:disabled{opacity:.3;cursor:not-allowed}
.fx2-timer{display:flex;align-items:center;gap:24px}
.tring2{position:relative;width:124px;height:124px}
.tring2 svg{transform:rotate(-90deg)}
.tring2 .tt2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:25px;color:#fff}
.tring2 .tt2 small{font-size:9px;letter-spacing:2px;color:#8a94b8;font-weight:800}
.tchip2{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.05);border-radius:99px;padding:6px 15px;
  font-size:12px;font-weight:800;color:#eff3ff;cursor:pointer;transition:.15s}
.tchip2:hover,.tchip2.on{border-color:#22d3ee;color:#22d3ee}
.fx2-exit{position:absolute;top:24px;right:28px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.05);
  border-radius:99px;padding:10px 22px;font-size:13px;font-weight:800;color:#eff3ff;cursor:pointer}
.fx2-exit:hover{border-color:#f472b6;color:#f472b6}
.qz2{position:fixed;inset:0;z-index:3100;background:rgba(4,6,12,.9);display:flex;align-items:center;justify-content:center;padding:30px;text-align:center}
.qz2 .qq2{font-size:clamp(22px,3.4vw,36px);font-weight:900;color:#fff;margin-bottom:10px;line-height:1.25;max-width:26ch}
.qz2 .pg2{font-size:12px;color:#8a94b8;letter-spacing:2px;margin-bottom:30px}
.qzo2{min-width:140px;padding:20px 28px;font-size:21px;font-weight:900;border-radius:18px;border:1px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.05);color:#fff;cursor:pointer;transition:.2s;margin:0 8px 12px}
.qzo2:hover{border-color:#22d3ee;transform:translateY(-4px)}
.qzo2.yes{background:#34d399;border-color:#34d399;color:#03301f}
.qzo2.no{background:#f472b6;border-color:#f472b6;color:#3d0a22}
.qz2-x{border:1px solid rgba(255,255,255,.13);background:none;border-radius:99px;padding:8px 20px;font-size:12.5px;
  font-weight:800;color:#8a94b8;cursor:pointer;margin-top:22px}

/* ===== LIBRARY HERO (from MAKTAB) ===== */
.lib-hero{position:relative;border-radius:22px;overflow:hidden;margin-bottom:24px;min-height:270px;display:flex;align-items:flex-end;padding:26px 28px;color:#fff;box-shadow:0 14px 40px rgba(20,30,70,.25)}
.lh-bg{position:absolute;inset:-30px;background-size:cover;background-position:center 25%;filter:blur(34px) saturate(1.3) brightness(.55);transform:scale(1.2)}
.lh-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,28,.25),rgba(8,12,28,.85))}
.lh-in{position:relative;display:flex;align-items:flex-end;gap:22px;width:100%}
.lh-cov{width:128px;aspect-ratio:3/4;border-radius:10px;overflow:hidden;flex-shrink:0;box-shadow:0 20px 44px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.15)}
.lh-cov img{width:100%;height:100%;object-fit:cover;display:block}
.lh-kick{font-size:10.5px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:#ffb300;margin-bottom:8px}
.lh-kick b{color:#22d3ee}
.lh-title{font-size:clamp(20px,2.8vw,32px);font-weight:900;line-height:1.1;margin-bottom:14px;font-family:'Baloo 2',sans-serif}
.lh-cta{display:flex;gap:10px;flex-wrap:wrap}
.lh-gold{border:none;border-radius:11px;padding:11px 22px;font-size:13.5px;font-weight:800;background:#ffb300;color:#1a1200;cursor:pointer;box-shadow:0 8px 26px rgba(255,179,0,.4);transition:.2s}
.lh-gold:hover{transform:translateY(-2px)}
.lh-ghost{border:1px solid rgba(255,255,255,.3);border-radius:11px;padding:11px 22px;font-size:13.5px;font-weight:800;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;transition:.2s}
.lh-ghost:hover{border-color:#22d3ee}
.lh-dots{position:absolute;right:22px;bottom:20px;display:flex;gap:6px}
.lh-dot{width:18px;height:4px;border-radius:99px;background:rgba(255,255,255,.25);border:none;padding:0;cursor:pointer;transition:.3s}
.lh-dot.on{background:#ffb300;width:30px}
@media(max-width:640px){.lib-hero{min-height:220px;padding:18px}.lh-cov{width:86px}.lh-in{gap:14px}}

/* ===== TOASTS ===== */
.toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:3000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:11px 20px;border-radius:12px;font-size:13.5px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:toastIn .25s}
[data-theme="dark"] .toast{background:#e8ecf7;color:#0c1322}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ===== COMMAND PALETTE ===== */
.cmdk{position:fixed;inset:0;background:rgba(10,18,38,.55);z-index:2000;display:flex;justify-content:center;padding:80px 20px 20px;backdrop-filter:blur(3px);animation:fadeIn .15s}
.cmdk-box{background:var(--surface);border-radius:16px;width:100%;max-width:600px;height:fit-content;max-height:70vh;display:flex;flex-direction:column;box-shadow:0 32px 64px rgba(0,0,0,.4);overflow:hidden;animation:popIn .18s}
.cmdk-inp{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border)}
.cmdk-inp input{flex:1;border:none;outline:none;font-size:16px;background:transparent;color:var(--text)}
.cmdk-list{overflow-y:auto;padding:8px}
.cmdk-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;cursor:pointer}
.cmdk-item:hover,.cmdk-item.hl{background:var(--surface2)}
.cmdk-item .ci{width:34px;height:34px;border-radius:9px;background:var(--chipbg);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.cmdk-item .cl{font-size:13.5px;font-weight:700;color:var(--text)}
.cmdk-item .cs{font-size:11.5px;color:var(--muted);margin-top:1px}
.cmdk-empty{padding:30px;text-align:center;color:var(--muted);font-size:13.5px}

/* ===== SWITCH ===== */
.switch{position:relative;width:46px;height:26px;background:var(--border);border-radius:20px;cursor:pointer;transition:background .2s;flex-shrink:0}
.switch.on{background:var(--green)}
.switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.switch.on .knob{left:23px}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--border)}
.setting-row:last-child{border-bottom:none}
.setting-row .st{font-size:14px;font-weight:800;color:var(--text)}
.setting-row .sd{font-size:12px;color:var(--muted);margin-top:2px}

/* ===== REPORT CARD ===== */
.rc-toolbar{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.report-sheet{background:#fff;color:#17203a;max-width:800px;margin:0 auto;border:1px solid #d8dce6;border-radius:8px;padding:34px 40px;box-shadow:0 3px 16px rgba(0,0,0,.07)}
.rc-head{display:flex;align-items:flex-start;justify-content:space-between;border-bottom:3px solid #0f3460;padding-bottom:12px}
.rc-head .sub{font-size:12.5px;color:#8a90a0;margin-top:2px;padding-left:4px}
.rc-badge{font-size:18px;font-weight:800;color:#0f3460;white-space:nowrap}
.rc-title{text-align:center;font-size:14px;font-weight:800;letter-spacing:1.5px;color:#e94560;margin:12px 0 18px;text-transform:uppercase}
.rc-info{display:grid;grid-template-columns:1fr 1fr;gap:8px 30px;margin-bottom:18px}
.rc-field{display:flex;align-items:center;gap:8px;font-size:13px}
.rc-field label{font-weight:700;color:#556;min-width:80px}
.rc-inp{border:none;border-bottom:1px dashed #c4cad8;padding:3px 5px;font-size:13px;flex:1;outline:none;background:transparent;color:#17203a}
.rc-inp:focus{border-bottom-color:#0f3460}
.rc-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:6px}
.rc-table th,.rc-table td{border:1px solid #d8dce6;padding:7px 10px;color:#17203a}
.rc-table th{background:#0f3460;color:#fff;font-weight:700;text-align:left}
.rc-table td.c,.rc-table th.c{text-align:center}
/* report-card row controls — quiet until you reach for them */
.rc-gut{border-left:none!important;border-top:none!important;border-bottom:none!important;border-right:none!important;background:transparent;width:30px;padding:0!important}
.rc-x{width:22px;height:22px;border-radius:50%;border:none;background:transparent;color:#a8b0c0;font-size:15px;line-height:1;cursor:pointer;opacity:0;transition:.15s;display:inline-flex;align-items:center;justify-content:center}
.rc-table tbody tr:hover .rc-x,.rc-table tbody tr:focus-within .rc-x,
.gtable tbody tr:hover .rc-x,.gtable tbody tr:focus-within .rc-x{opacity:.75}
.rc-x:hover{opacity:1!important;background:#fdecef;color:#e94560}
@media (hover:none){.rc-table .rc-x,.gtable .rc-x{opacity:.5}}
.rc-add td{border:1px dashed #cfd6e4!important;color:#8a93a6;font-weight:700;cursor:pointer;transition:.15s;background:transparent}
.rc-add:hover td{color:#0f3460;background:#f4f7fd;border-color:#0f3460!important}
.gtable .rc-add td{border:1px dashed var(--border)!important;color:var(--muted);background:transparent}
.gtable .rc-add:hover td{color:var(--brand);background:var(--surface2);border-color:var(--navy)!important}
.sub-add{border:none;background:transparent;font:inherit;font-weight:700;color:inherit;outline:none;width:100%;padding:0}
.sub-add::placeholder{color:inherit;opacity:.85}
/* "Add a subject" as a real control: an input beside a full button, not a faint ghost line */
.add-row td{border:none!important;background:transparent!important;padding:12px 4px 4px!important}
.add-wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.add-inp{flex:1;min-width:180px;padding:10px 13px;border:1.5px dashed var(--border);border-radius:9px;font:inherit;font-size:13.5px;font-weight:600;background:var(--surface);color:var(--text);outline:none;transition:border .15s}
.add-inp:focus{border-style:solid;border-color:var(--navy)}
.add-inp::placeholder{color:var(--muted);font-weight:600}
.add-btn{white-space:nowrap;padding:10px 18px;border-radius:9px;font-size:12.5px;font-weight:800;border:none;cursor:pointer;background:var(--navy);color:#fff;box-shadow:0 2px 6px rgba(15,52,96,.18)}
.add-btn:hover{filter:brightness(1.12)}
.photo-pick{display:flex;gap:14px;align-items:center;padding:12px 14px;border:1.5px dashed var(--border);border-radius:12px;background:var(--surface2)}
.photo-pick .av-btn{flex:none}
.pp-t{font-weight:800;font-size:13.5px;color:var(--brand)}.pp-s{font-size:12px;color:var(--muted);margin-top:2px}
.hero-av{position:relative;flex:none}

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useEffect,useRef} = React;
const C = window.AZHAR_CONTENT || {books:[]};
const LVL_LABEL={One:"Class 1",Two:"Class 2",Three:"Class 3",Four:"Class 4",Five:"Class 5"};
const BOOKS = C.books;
const BASE = "../AzharEd_Deploy/";
const LOGO_AZHAR = BASE+"assets/azhar_logo.png";
const LOGO_BF = BASE+"assets/bookfactory_logo.png";

/* ---------- persistence ---------- */
const NS = "azhared2:";
const LS = {
  get(k,d){ try{const v=localStorage.getItem(NS+k);return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{localStorage.setItem(NS+k,JSON.stringify(v));}catch(e){} },
  del(k){ try{localStorage.removeItem(NS+k);}catch(e){} },
  keys(){ try{return Object.keys(localStorage).filter(k=>k.indexOf(NS)===0).map(k=>k.slice(NS.length));}catch(e){return[];} }
};
function useLS(key,init){
  const [v,setV]=useState(()=>LS.get(key,init));
  useEffect(()=>{ LS.set(key,v); },[key,v]);
  return [v,setV];
}

/* ---------- toasts ---------- */
let toast = ()=>{};
function Toasts(){
  const [list,setList]=useState([]);
  useEffect(()=>{
    toast=(msg,icon="✅")=>{
      const id=Date.now()+Math.random();
      setList(l=>[...l.slice(-2),{id,msg,icon}]);
      setTimeout(()=>setList(l=>l.filter(t=>t.id!==id)),2600);
    };
    return ()=>{toast=()=>{};};
  },[]);
  return <div className="toasts">{list.map(t=><div key={t.id} className="toast">{t.icon} {t.msg}</div>)}</div>;
}

/* ---------- activity / progress ---------- */
function recordOpen(entry){
  const list=LS.get("recent",[]);
  LS.set("recent",[{...entry,at:Date.now()},...list.filter(x=>x.path!==entry.path)].slice(0,12));
}
function markViewed(bookId,path){
  const v=LS.get("viewed",{});
  const set=new Set(v[bookId]||[]);
  set.add(path);
  v[bookId]=[...set];
  LS.set("viewed",v);
}
const isViewed=(viewed,bookId,path)=>((viewed[bookId]||[]).indexOf(path)>=0);
const openFile=(p,meta)=>{ if(!p)return; if(meta){recordOpen({path:p,...meta}); if(meta.bookId)markViewed(meta.bookId,p);} window.open(encodeURI(BASE+p),"_blank"); };
const initials = n => n.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
const SERIES_COLOR = {GoldCrest:["#0f3460","#1a4a8a"], Panda:["#b23048","#e94560"]};
const seriesGrad = s => `linear-gradient(135deg,${(SERIES_COLOR[s]||["#0f3460","#1a4a8a"]).join(",")})`;
const todayISO = ()=>new Date().toISOString().slice(0,10);
const niceDate = iso => new Date(iso+"T12:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const rupee = n => "Rs " + Number(n||0).toLocaleString("en-PK");
const timeAgo = t => {const m=Math.round((Date.now()-t)/60000); if(m<1)return "just now"; if(m<60)return m+" min ago"; const h=Math.round(m/60); if(h<24)return h+"h ago"; return Math.round(h/24)+"d ago";};

/* ---------- progress ring ---------- */
function Ring({pct,size=46,stroke=5,color="var(--green)",label}){
  const r=(size-stroke)/2, c=2*Math.PI*r, p=Math.max(0,Math.min(100,Math.round(pct||0)));
  return (
   <div className="ringwrap" style={{width:size,height:size}} title={p+"%"}>
    <svg width={size} height={size}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--border)" strokeWidth={stroke}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={c*(1-p/100)} transform={`rotate(-90 ${size/2} ${size/2})`}
        style={{transition:'stroke-dashoffset .4s'}}/>
    </svg>
    <div className="ring-lbl" style={{fontSize:Math.max(8,Math.round(size*0.22))}}>{label!=null?label:p+"%"}</div>
   </div>
  );
}

/* ---------- photos ---------- */
function Avatar({photo,name,size=30,bg}){
  return photo
    ? <img className="av-sm" style={{width:size,height:size}} src={photo} alt={name||""}/>
    : <div className="avatar" style={{width:size,height:size,fontSize:Math.round(size*0.37),background:bg||'#5b7bb5'}}>{initials(name||"?")}</div>;
}
function pickPhoto(cb){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return;
    const img=new Image();
    img.onload=()=>{ try{
        const S=128, cv=document.createElement("canvas"); cv.width=S; cv.height=S;
        const ctx=cv.getContext("2d"), m=Math.min(img.width,img.height);
        ctx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
        cb(cv.toDataURL("image/jpeg",0.72));
      }catch(e){ toast("Couldn't process that image","⚠️"); } };
    img.onerror=()=>toast("Couldn't read that image","⚠️");
    img.src=URL.createObjectURL(f);
  };
  inp.click();
}
function storageBytes(){ let b=0; LS.keys().forEach(k=>{ b+=((localStorage.getItem(NS+k)||"").length+k.length+9)*2; }); return b; }

/* ---------- Urdu interface ---------- */
const UR={
 "Dashboard":"ڈیش بورڈ","Book Library":"کتب خانہ","Teacher Training":"اساتذہ کی تربیت","Class Gradebook":"کلاس گریڈ بک",
 "Report Cards":"رپورٹ کارڈز","School Management":"اسکول انتظامیہ","Profile & Settings":"پروفائل اور ترتیبات",
 "Paper Generator":"پرچہ ساز","Lesson Planner":"ہفتہ وار منصوبہ","Homework Diary":"ہوم ورک ڈائری","Certificates":"اسناد",
 "Main":"مرکزی","Teaching":"تدریس","Administration":"انتظامیہ","Account":"اکاؤنٹ","Sign out":"لاگ آؤٹ",
 "Overview":"جائزہ","Students":"طلبہ","Staff":"عملہ","Fees":"فیسیں","Student Attendance":"طلبہ کی حاضری",
 "Staff Attendance":"عملے کی حاضری","Timetable":"ٹائم ٹیبل","Notices":"اعلانات","Reports":"رپورٹس",
 "Interactive books":"انٹرایکٹو کتابیں","Exam papers":"امتحانی پرچے","Resources opened":"کھولے گئے وسائل","Favourite books":"پسندیدہ کتابیں",
 "Quick actions":"فوری اقدامات","Continue where you left off":"جہاں چھوڑا تھا وہیں سے جاری رکھیں",
 "Your favourite books":"آپ کی پسندیدہ کتابیں","Latest notices":"تازہ اعلانات",
 "Search books, papers…":"کتابیں اور پرچے تلاش کریں…","teacher":"استاد","admin":"منتظم"
};
let LANGV="en";
const t=s=>(LANGV==="ur"&&UR[s])||s;

/* ---------- CSV / backup ---------- */
function downloadFile(name,content,type){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([content],{type}));
  a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function downloadCSV(name,rows){
  const csv=rows.map(r=>r.map(x=>{x=String(x==null?"":x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}).join(",")).join("\n");
  downloadFile(name,"﻿"+csv,"text/csv;charset=utf-8");
  toast("CSV downloaded","📥");
}
function exportBackup(){
  // Everything the whole MAKTAB family saves on this device — Teach, One, Stage and Family portal.
  const data={};
  for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
    if(/^(azhared2:|azharedone:|azharedfam:|maktab:)/.test(k)) data[k]=localStorage.getItem(k); }
  downloadFile("MAKTAB_school_backup_"+todayISO()+".json",JSON.stringify({app:"AzharEd",version:3,exported:new Date().toISOString(),data},null,1),"application/json");
  try{localStorage.setItem("azhared2:lastBackup",JSON.stringify(Date.now()));}catch(e){}
  toast("Backup downloaded — keep it somewhere safe (Drive, USB, email)","💾");
}
function importBackup(file,done){
  const r=new FileReader();
  r.onload=()=>{ try{
      const obj=JSON.parse(r.result);
      if(!obj||obj.app!=="AzharEd"||!obj.data) throw new Error("bad");
      Object.keys(obj.data).forEach(k=>{
        if(obj.version>=3) localStorage.setItem(k,obj.data[k]);   // raw keys incl. One/Family registers
        else LS.set(k,obj.data[k]);                               // old v2 backups still restore fine
      });
      done(true);
    }catch(e){done(false);} };
  r.readAsText(file);
}

/* ---------- CLOUD BACKUP (school account only) ---------- */
function collectBackupData(){
  const data={};
  for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
    if(/^(azhared2:|azharedone:|azharedfam:|maktab:)/.test(k) && k!=="azhared2:session") data[k]=localStorage.getItem(k); }
  return data;
}
async function requireLiveSession(){
  try{
    const {data} = await withTimeout(SB.auth.getSession(), 8000);
    return !!(data && data.session);
  }catch(e){ return false; }
}
const OFFLINE_SESSION_MSG = "You signed in offline, so the cloud doesn't know this session yet. Sign out and sign in again (with internet) to reconnect cloud backup.";
async function cloudBackupPush(user){
  if(!user||!user.cloud) return {err:"Cloud backup needs a school account. Please sign out and sign in again."};
  if(!navigator.onLine) return {err:"No internet — connect and try again."};
  if(!window.SB) return {err:"Cloud is not available in this browser."};
  if(!(await requireLiveSession())) return {err: OFFLINE_SESSION_MSG};
  const data=collectBackupData();
  const bytes=JSON.stringify(data).length;
  const {error}=await SB.from("cloud_backups").insert({school_id:user.school_id,data:data,bytes:bytes,device:navigator.platform||""});
  if(error) return {err: /row.level security|policy/i.test(error.message||"") ? OFFLINE_SESSION_MSG : ("Backup failed: "+(error.message||"connection problem."))};
  try{
    const {data:rows}=await SB.from("cloud_backups").select("id,created_at").eq("school_id",user.school_id).order("created_at",{ascending:false});
    if(rows&&rows.length>15){ await SB.from("cloud_backups").delete().in("id",rows.slice(15).map(r=>r.id)); }
  }catch(e){}
  try{localStorage.setItem("azhared2:lastBackup",JSON.stringify(Date.now()));}catch(e){}
  return {ok:true,bytes:bytes};
}
async function cloudBackupRestore(user){
  if(!user||!user.cloud) return {err:"Cloud restore needs a school account."};
  if(!navigator.onLine) return {err:"No internet — connect and try again."};
  if(!window.SB) return {err:"Cloud is not available in this browser."};
  if(!(await requireLiveSession())) return {err: OFFLINE_SESSION_MSG};
  const {data:rows,error}=await SB.from("cloud_backups").select("data,created_at").eq("school_id",user.school_id).order("created_at",{ascending:false}).limit(1);
  if(error) return {err:"Could not fetch the backup: "+(error.message||"connection problem.")};
  if(!rows||!rows.length) return {err:"No cloud backup exists yet for this school."};
  const data=rows[0].data||{};
  Object.keys(data).forEach(k=>{ try{localStorage.setItem(k,data[k]);}catch(e){} });
  return {ok:true,when:rows[0].created_at};
}
/* Once a day, quietly back this device up so nobody has to remember to press the button. */
const AUTO_KEY="azhared2:autoBackupOn", AUTO_LAST="azhared2:autoBackupAt";
function autoBackupOn(){ try{ return localStorage.getItem(AUTO_KEY)!=="0"; }catch(e){ return true; } }
async function maybeAutoBackup(user){
  try{
    if(!user||!user.cloud||!autoBackupOn()||!navigator.onLine) return;
    const last=+(localStorage.getItem(AUTO_LAST)||0);
    if(Date.now()-last < 20*60*60*1000) return;          /* once every 20 hours is plenty */
    localStorage.setItem(AUTO_LAST,String(Date.now()));  /* stamp first so two tabs don't both push */
    const r=await cloudBackupPush(user);
    if(r&&r.err) localStorage.setItem(AUTO_LAST,String(last));  /* failed — let it try again later */
  }catch(e){}
}
function CloudCard({user}){
  const [busy,setBusy]=useState("");
  const [arm,setArm]=useState(false);
  const [auto,setAuto]=useState(autoBackupOn());
  const toggleAuto=()=>{ const v=!auto; setAuto(v);
    try{ localStorage.setItem(AUTO_KEY, v?"1":"0"); }catch(e){}
    toast(v?"Automatic daily backup is on":"Automatic backup turned off", v?"☁️":"⏸️"); };
  if(!user||!user.cloud) return null;
  /* Only the school's admin account may replace a device's records. Teachers can back up, never restore. */
  const canRestore = user.role==="admin";
  const push=async()=>{ setBusy("push");
    const r=await cloudBackupPush(user);
    setBusy(""); if(r.err) toast(r.err,"⚠️"); else toast("Backed up to the cloud — "+(r.bytes/1024).toFixed(0)+" KB saved for "+user.school,"☁️"); };
  const restore=async()=>{
    if(!arm){ setArm(true); setTimeout(()=>setArm(false),6000); return; }
    setArm(false); setBusy("restore");
    const r=await cloudBackupRestore(user);
    setBusy("");
    if(r.err) toast(r.err,"⚠️");
    else { toast("Cloud backup restored — reloading","☁️"); setTimeout(()=>location.reload(),900); } };
  return (
    <div className="card" style={{maxWidth:560}}>
      <h3>☁️ Cloud backup — {user.school}</h3>
      <p style={{fontSize:12.5,color:'var(--muted)',marginBottom:14,lineHeight:1.6}}>Back up this device's records to your school's private shelf in the cloud, and restore them on any computer where your school is signed in. Restoring <b>replaces</b> this device's records with the cloud copy.</p>
      <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
        <button className="btn btn-navy" onClick={push} disabled={busy!==""}>{busy==="push"?"Backing up…":"☁️⬆️ Back up to cloud"}</button>
        {canRestore && <button className={"btn "+(arm?"btn-danger":"btn-outline")} data-restore onClick={restore} disabled={busy!==""}>{busy==="restore"?"Restoring…":(arm?"Press again to replace this device's records":"☁️⬇️ Restore from cloud")}</button>}
      </div>
      <div className="setting-row" style={{marginTop:16}}>
        <div><div className="st">🔁 Automatic daily backup</div><div className="sd">Backs this laptop up once a day on its own, whenever it is online — so a lost laptop never means lost records.</div></div>
        <div className={"switch"+(auto?" on":"")} data-autobk onClick={toggleAuto}><div className="knob"></div></div>
      </div>
      {!canRestore && <p className="hint" style={{marginTop:12}}>🔒 Restoring replaces every record on this laptop, so it is limited to the school's admin account. You can back up as often as you like.</p>}
    </div>
  );
}

/* ---------- WhatsApp helper ---------- */
function waLink(phone,msg){
  let digits=String(phone||"").replace(/[^0-9]/g,"");
  if(!digits) return null;
  if(digits.indexOf("0")===0) digits="92"+digits.slice(1);
  return "https://wa.me/"+digits+"?text="+encodeURIComponent(msg);
}

/* ---------- search index ---------- */
const SEARCH_INDEX=(()=> {
  const ix=[];
  BOOKS.forEach(b=>{
    ix.push({type:"book",icon:b.icon,label:b.title+" · "+b.level,sub:b.series+" Series · open book page",book:b});
    if(b.flipbook) ix.push({type:"flipbook",icon:"📖",label:b.title+" Flipbook · "+b.level,sub:"Digital flipbook",path:b.flipbook,book:b});
    if(b.interactive) ix.push({type:"interactive",icon:"🎯",label:b.title+" Interactive · "+b.level,sub:"Interactive lesson",path:b.interactive,book:b});
    if(b.deckPdf||b.deck) ix.push({type:"deck",icon:"🖥️",label:b.title+" Teaching Slides · "+b.level,sub:"Projectable deck",path:b.deckPdf||b.deck,book:b});
    (b.papers||[]).forEach(p=>ix.push({type:"paper",icon:"📄",label:p.label+" — "+b.title+" ("+b.level+")",sub:"Exam paper",path:p.path,book:b}));
  });
  return ix;
})();
const PAGE_LINKS=[
  ["dashboard","🏠","Dashboard"],["library","📚","Book Library"],["training","🎓","Teacher Training"],
  ["gradebook","📊","Class Gradebook"],["reportcards","🧾","Report Cards"],["admin","🏫","School Management"],["accounts","💵","Accounts"],["profile","👤","Profile & Settings"]
];

function SearchModal({onClose,onOpenBook,go}){
  const [q,setQ]=useState("");
  const inpRef=useRef(null);
  useEffect(()=>{ inpRef.current && inpRef.current.focus(); },[]);
  const ql=q.toLowerCase().trim();
  const results=useMemo(()=>{
    if(!ql) return [];
    const toks=ql.split(/\s+/);
    const pages=PAGE_LINKS.filter(([id,ic,l])=>toks.every(t=>l.toLowerCase().includes(t))).map(([id,ic,l])=>({type:"page",icon:ic,label:l,sub:"Go to page",page:id}));
    /* people first — searching a child's or teacher's name should find them, not a book */
    const people=[];
    try{
      LS.get("sms:students",[]).forEach(st=>{
        const hay=(st.name+" "+(st.guardian||"")+" "+(st.phone||"")+" "+st.cls+" "+st.sec).toLowerCase();
        if(toks.every(t=>hay.includes(t))) people.push({type:"page",icon:"🎒",label:st.name,
          sub:"Student · "+st.cls+" "+st.sec+" · Roll "+st.roll+(st.left?" · has left":""),page:"admin"});
      });
      LS.get("sms:staff",[]).forEach(sf=>{
        const hay=(sf.name+" "+(sf.subject||"")+" "+(sf.phone||"")+" "+(sf.role||"")).toLowerCase();
        if(toks.every(t=>hay.includes(t))) people.push({type:"page",icon:"👩‍🏫",label:sf.name,
          sub:(sf.role||"Staff")+(sf.subject&&sf.subject!=="—"?" · "+sf.subject:""),page:"admin"});
      });
    }catch(e){}
    const items=SEARCH_INDEX.filter(it=>{const hay=(it.label+" "+it.sub+" "+(it.book?it.book.series+" "+it.book.subject:"")).toLowerCase();return toks.every(t=>hay.includes(t));});
    return [...people.slice(0,8),...pages,...items].slice(0,16);
  },[ql]);
  const pick=it=>{
    onClose();
    if(it.type==="page") go(it.page);
    else if(it.type==="book") onOpenBook(it.book);
    else openFile(it.path,{type:it.type,bookId:it.book.id,label:it.label,icon:it.icon});
  };
  return (
   <div className="cmdk" onClick={onClose}>
    <div className="cmdk-box" onClick={e=>e.stopPropagation()}>
      <div className="cmdk-inp">🔍<input ref={inpRef} value={q} placeholder="Search students, staff, books, papers, pages…" onChange={e=>setQ(e.target.value)} onKeyDown={e=>{if(e.key==="Escape")onClose(); if(e.key==="Enter"&&results[0])pick(results[0]);}}/></div>
      <div className="cmdk-list">
        {!ql && <div className="cmdk-empty">Type to search your students and staff, all {BOOKS.length} books, {SEARCH_INDEX.filter(i=>i.type==="paper").length} exam papers and every page.<br/><span style={{fontSize:11.5}}>Tip: try a child\u2019s name, a guardian\u2019s name, \u201cpanda urdu\u201d or \u201cgradebook\u201d.</span></div>}
        {ql && results.length===0 && <div className="cmdk-empty">No matches for “{q}”.</div>}
        {results.map((it,i)=>(
          <div key={i} className={"cmdk-item"+(i===0?" hl":"")} onClick={()=>pick(it)}>
            <div className="ci">{it.icon}</div>
            <div><div className="cl">{it.label}</div><div className="cs">{it.sub}</div></div>
          </div>))}
      </div>
    </div>
   </div>
  );
}

/* ---------- AUTH ---------- */
/* All accounts live in the cloud (Supabase Auth);
   no passwords exist anywhere in this page. */
function withTimeout(promise, ms){
  return Promise.race([promise, new Promise((_,rej)=>setTimeout(()=>rej(new Error("MAKTAB_TIMEOUT")), ms))]);
}
/* Offline grace: after a successful cloud sign-in on a device, that same person can
   sign back in on that device even when the server is unreachable. Only a salted
   one-way hash of the password is kept — never the password itself — and the
   fallback is used ONLY when the server cannot be reached, never when it says
   the password is wrong. */
async function pwHash(salt, pw){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt+"|"+pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function authCacheRead(){ try{ return JSON.parse(localStorage.getItem("azhared2:authcache")||"{}"); }catch(e){ return {}; } }
async function authCacheSave(email, pw, user){
  try{
    const cache = authCacheRead();
    const salt = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
    cache[email] = { salt, hash: await pwHash(salt, pw), user: user, savedAt: Date.now() };
    localStorage.setItem("azhared2:authcache", JSON.stringify(cache));
  }catch(e){}
}
async function offlineSignIn(email, pw){
  try{
    const entry = authCacheRead()[email];
    if(!entry || !entry.hash) return null;
    if((await pwHash(entry.salt, pw)) !== entry.hash) return null;
    return Object.assign({}, entry.user, {offline:true});
  }catch(e){ return null; }
}
async function cloudSignIn(email, pw){
  const offline = async (msg) => {
    const off = await offlineSignIn(email, pw);
    if(off) return {user: off, offline:true};
    return {err: msg};
  };
  if(!navigator.onLine) return offline("Internet is needed to sign in. Please connect and try again.");
  if(!window.SB) return offline("Cloud sign-in is not available in this browser. Please update your browser.");
  let data, error;
  try{
    ({data,error} = await withTimeout(SB.auth.signInWithPassword({email, password: pw}), 15000));
  }catch(e){
    return offline("The server is taking too long to answer. Please try again in a few minutes.");
  }
  if(error){
    if(/invalid/i.test(error.message||"")) return {err:"Invalid email or password."};
    return offline("Could not sign in: "+(error.message||"connection problem."));
  }
  const uid = data && data.user && data.user.id;
  let prof;
  try{
    ({data:prof} = await withTimeout(SB.from("profiles").select("role,school_id,full_name,is_owner").eq("id",uid).maybeSingle(), 15000));
  }catch(e){
    return offline("Signed in, but could not load your profile — please try again in a moment.");
  }
  if(!prof || !prof.school_id){ await SB.auth.signOut(); return {err:"This account is not yet assigned to a school. Please contact Azhar Publishers."}; }
  let schoolName = "";
  const {data:sch} = await SB.from("schools").select("name,active").eq("id",prof.school_id).maybeSingle();
  if(sch && sch.active===false){ await SB.auth.signOut(); return {err:"This school's subscription is not active. Please contact Azhar Publishers."}; }
  if(sch) schoolName = sch.name;
  const user = {id:uid,email:(data.user.email||email),name:(prof.full_name||email),role:prof.role,school:schoolName,school_id:prof.school_id,cloud:true,owner:!!prof.is_owner};
  await authCacheSave(email, pw, user);
  /* note the sign-in in the school's own history (the owner's dashboard reads it) — never blocks the login */
  try{ SB.rpc("log_signin",{p_device:(navigator.platform||"")+" · "+(navigator.userAgent.match(/(Chrome|Safari|Firefox|Edg)\/[\d.]+/)||[""])[0]}).then(function(){},function(){}); }catch(e){}
  return {user: user};
}
function Auth({onLogin}){
  const [email,setEmail]=useState(""),[pw,setPw]=useState(""),[err,setErr]=useState(""),[busy,setBusy]=useState(false);
  const submit=async()=>{
    const em=email.toLowerCase().trim();
    if(!em||!pw){ setErr("Enter your email and password."); return; }
    setBusy(true); setErr("");
    try{
      const r=await cloudSignIn(em,pw);
      if(r.err) setErr(r.err);
      else {
        onLogin(r.user);
        if(r.offline) setTimeout(()=>toast("Signed in offline — cloud backup will reconnect when the server is back.","📴"), 600);
      }
    }
    catch(e){
      const off = await offlineSignIn(em,pw);
      if(off){ onLogin(off); setTimeout(()=>toast("Signed in offline — cloud backup will reconnect when the server is back.","📴"), 600); }
      else setErr("Could not reach the server — check your internet and try again.");
    }
    setBusy(false);
  };
  return (
   <div className="auth-wrap">
    <div className="auth-left">
      <div className="auth-brand">
        <div className="logo-bar">
          <img src={LOGO_AZHAR} alt="Azhar Publishers"/>
          <div className="divider"></div>
          <img src={LOGO_BF} alt="Book Factory"/>
        </div>
        <div className="mark">MAKTA<span>B</span></div>
        <h1>The teaching platform for Azhar Publishers schools</h1>
        <p>Your GoldCrest &amp; Panda early-years books — flipbooks, interactive lessons, teaching slides and exam papers — in one place for every teacher.</p>
        <div className="auth-feat"><div className="fi">📚</div>{BOOKS.length} interactive books · {BOOKS.reduce((a,b)=>a+b.paperCount,0)} exam papers</div>
        <div className="auth-feat"><div className="fi">🔍</div>Instant search across every book and paper</div>
        <div className="auth-feat"><div className="fi">📊</div>Gradebook, report cards, fees &amp; attendance — saved on this device</div>
        <div className="auth-feat"><div className="fi">🌙</div>Works on mobile, tablet and whiteboard · light &amp; dark mode</div>
      </div>
    </div>
    <div className="auth-right">
      <div className="auth-card">
        <h2>MAKTA<span>B</span></h2>
        <div className="sub">Teacher &amp; School Portal</div>
        {err && <div className="err">{err}</div>}
        <div className="field"><label>Email</label><input value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} placeholder="you@azhar.edu"/></div>
        <div className="field"><label>Password</label><input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} placeholder="••••••••"/></div>
        <button className="btn-primary" onClick={submit} disabled={busy}>{busy?"Signing in…":"Sign In"}</button>
        <div className="demo">
          <p>School accounts are issued by Azhar Publishers</p>
        </div>
      </div>
    </div>
   </div>
  );
}
/* ---------- FOCUS MODE (imported from MAKTAB) ---------- */
function FocusMode({book,onClose}){
  const [mins,setMins]=useState(()=>LS.get("fxmin",20));
  const [left,setLeft]=useState(mins*60);
  const [run,setRun]=useState(false);
  const [quiz,setQuiz]=useState(null);
  useEffect(()=>{ if(!run) return;
    const t=setInterval(()=>setLeft(l=>{ if(l<=1){ setRun(false); toast("⏰ Time's up — shabash class!","🎉"); return 0; } return l-1; }),1000);
    return ()=>clearInterval(t); },[run]);
  const total=mins*60;
  const setM=m=>{ setMins(m); setLeft(m*60); setRun(false); LS.set("fxmin",m); };
  const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  const r=52,c=2*Math.PI*r,p=total?left/total:0;
  const bank=(window.AZHAR_QBANK||{})[book.id];
  const mcq=bank?bank.items.filter(q=>q.k==="mcq"&&q.options.length<=4):[];
  const startQuiz=()=>{ const used={},qs=[];
    while(qs.length<3&&qs.length<mcq.length){ const q=mcq[Math.floor(Math.random()*mcq.length)];
      if(!used[q.text]){used[q.text]=1;qs.push(q);} }
    setQuiz({qs,i:0,right:0,picked:null}); };
  const pick=oi=>{ if(quiz.picked!=null) return;
    const q=quiz.qs[quiz.i], correct=q.options[oi]===q.answer;
    setQuiz({...quiz,picked:oi,right:quiz.right+(correct?1:0)});
    setTimeout(()=>setQuiz(z=>z?{...z,i:z.i+1,picked:null}:z),1100); };
  const open=(p2,type,icon,label)=>openFile(p2,{type,bookId:book.id,icon,label});
  return (
   <div className="fx2">
    <button className="fx2-exit" onClick={onClose}>✕ &nbsp;Exit stage</button>
    <div className="kick2">{book.series} SERIES · <b>{book.level.toUpperCase()}</b> · FOCUS MODE</div>
    <h2>{book.title}</h2>
    <div className="fx2-acts">
      <button className="fxa2" disabled={!book.flipbook} onClick={()=>open(book.flipbook,"flipbook","📖",book.title+" Flipbook · "+book.level)}><span className="i">📖</span>Flipbook<small>read together</small></button>
      <button className="fxa2" disabled={!book.interactive} onClick={()=>open(book.interactive,"interactive","🎯",book.title+" Interactive · "+book.level)}><span className="i">🎯</span>Interactive<small>play on the board</small></button>
      <button className="fxa2" disabled={!(book.deckPdf||book.deck)} onClick={()=>open(book.deckPdf||book.deck,"deck","🖥️",book.title+" Slides · "+book.level)}><span className="i">🖥️</span>Slides<small>teach &amp; project</small></button>
      <button className="fxa2" disabled={mcq.length<3} onClick={startQuiz}><span className="i">⚡</span>Quick quiz<small>{mcq.length>=3?mcq.length+" questions from its pages":"no bank yet"}</small></button>
    </div>
    <div className="fx2-timer">
      <div className="tring2">
        <svg width="124" height="124">
          <circle cx="62" cy="62" r={r} fill="none" stroke="rgba(255,255,255,.1)" strokeWidth="9"/>
          <circle cx="62" cy="62" r={r} fill="none" stroke={left<=60?"#f472b6":"#22d3ee"} strokeWidth="9" strokeLinecap="round"
            strokeDasharray={c} strokeDashoffset={c*(1-p)} style={{transition:"stroke-dashoffset .5s linear"}}/>
        </svg>
        <div className="tt2">{fmt(left)}<small>{run?"TEACHING":"PAUSED"}</small></div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8,alignItems:"flex-start"}}>
        <div style={{display:"flex",gap:8}}>{[10,20,30,40].map(m=>
          <button key={m} className={"tchip2"+(mins===m?" on":"")} onClick={()=>setM(m)}>{m} min</button>)}</div>
        <div style={{display:"flex",gap:8}}>
          <button className="tchip2" onClick={()=>setRun(x=>!x)}>{run?"⏸ Pause":"▶ Start lesson"}</button>
          <button className="tchip2" onClick={()=>{setRun(false);setLeft(total);}}>↺ Reset</button>
        </div>
      </div>
    </div>
    {quiz && (quiz.i>=quiz.qs.length
      ? <div className="qz2"><div>
          <div className="qq2">{quiz.right===quiz.qs.length?"🌟 Perfect!":"👏 Well done!"}</div>
          <div className="pg2">{quiz.right} OUT OF {quiz.qs.length}</div>
          <button className="lh-gold" onClick={startQuiz}>⚡ Three more</button>
          <div><button className="qz2-x" onClick={()=>setQuiz(null)}>Back to the lesson</button></div>
        </div></div>
      : <div className="qz2"><div>
          <div className="qq2">{quiz.qs[quiz.i].text}</div>
          <div className="pg2">QUESTION {quiz.i+1} OF {quiz.qs.length} · PAGE {quiz.qs[quiz.i].pg} OF THE BOOK</div>
          <div>{quiz.qs[quiz.i].options.map((o,oi)=>{
            const q=quiz.qs[quiz.i];
            const cls2=quiz.picked==null?"":(o===q.answer?" yes":(oi===quiz.picked?" no":""));
            return <button key={oi} className={"qzo2"+cls2} onClick={()=>pick(oi)}>{o}</button>;})}</div>
          <div><button className="qz2-x" onClick={()=>setQuiz(null)}>✕ Close quiz</button></div>
        </div></div>)}
   </div>
  );
}

function LibraryHero({onOpen,onFocus}){
  const feats=useMemo(()=>BOOKS.filter(b=>b.coverImg),[]);
  const [i,setI]=useState(()=>Math.floor(Math.random()*Math.max(feats.length,1)));
  useEffect(()=>{ const t=setInterval(()=>setI(x=>(x+1)%feats.length),7000); return ()=>clearInterval(t); },[feats.length]);
  if(!feats.length) return null;
  const b=feats[i%feats.length];
  return (
   <div className="lib-hero">
    <div className="lh-bg" style={{backgroundImage:`url("${encodeURI(BASE+b.coverImg)}")`}}></div>
    <div className="lh-veil"></div>
    <div className="lh-in">
      <div className="lh-cov"><img src={encodeURI(BASE+b.coverImg)} alt=""/></div>
      <div style={{flex:1,minWidth:0}}>
        <div className="lh-kick">{b.series} SERIES · <b>{b.level.toUpperCase()}</b> · FEATURED</div>
        <div className="lh-title">{b.title}</div>
        <div className="lh-cta">
          <button className="lh-gold" onClick={()=>onFocus(b)}>▶ &nbsp;Teach this now</button>

        </div>
      </div>
    </div>
    <div className="lh-dots">{feats.slice(0,8).map((_,di)=>
      <button key={di} className={"lh-dot"+(di===i%Math.min(feats.length,8)?" on":"")} onClick={()=>setI(di)}></button>)}</div>
   </div>
  );
}

/* ---------- LIBRARY ---------- */
function Library({openBook,favs,setFavs,onFocus}){
  const [series,setSeries]=useState("All");
  const [level,setLevel]=useState("All");
  const [subject,setSubject]=useState("All");
  const [q,setQ]=useState("");
  const [sort,setSort]=useState("default");
  const [onlyFav,setOnlyFav]=useState(false);
  const viewed=LS.get("viewed",{});
  const subjects=useMemo(()=>["All",...new Set(BOOKS.map(b=>b.subject))],[]);
  const toggleFav=(e,id)=>{ e.stopPropagation(); const on=favs.indexOf(id)>=0;
    setFavs(on?favs.filter(f=>f!==id):[...favs,id]); toast(on?"Removed from favourites":"Added to favourites",on?"☆":"⭐"); };
  let filtered=BOOKS.filter(b=>
    (series==="All"||b.series===series)&&(level==="All"||b.level===level)&&(subject==="All"||b.subject===subject)
    &&(!onlyFav||favs.indexOf(b.id)>=0)
    &&(!q.trim()||((b.title+" "+b.series+" "+b.level+" "+b.subject).toLowerCase().includes(q.toLowerCase().trim()))));
  if(sort==="az") filtered=[...filtered].sort((a,b)=>a.title.localeCompare(b.title));
  if(sort==="level") filtered=[...filtered].sort((a,b)=>["Playgroup","Nursery","Prep"].indexOf(a.level)-["Playgroup","Nursery","Prep"].indexOf(b.level));

/* ---------- GRADEBOOK ---------- */
const GB_TERMS=["1st Term","2nd Term","3rd Term"];
const TT_CLASSES = ["Playgroup","Nursery","Prep","One","Two","Three","Four","Five"];
const TT_SECTIONS = ["A","B","C","D"];
const EARLY_CLASSES=["Playgroup","Nursery","Prep"];
const isEarly=cls=>EARLY_CLASSES.indexOf(cls)>=0;
const DEFAULT_SUBJECTS={early:["English","Urdu","Counting"],primary:["English","Urdu","Maths","Islamiat","General Knowledge","Science"]};
/* The school's grading key — one scale shared by the Gradebook and Report Cards,
   editable in the Gradebook. Bands are "grade X from this % upwards". */
const GRADE_DEFAULT=[{min:80,label:"A"},{min:65,label:"B"},{min:50,label:"C"},{min:1,label:"D"}];
const GRADE_COLORS=["#00a884","#2f6fed","#F0A500","#e94560","#7c4dff","#00838f","#c2185b"];
function sortScale(sc){ return [...(sc&&sc.length?sc:GRADE_DEFAULT)].sort((a,b)=>(+b.min||0)-(+a.min||0)); }
function gradeFor(sc,p){
  const s=sortScale(sc);
  for(let i=0;i<s.length;i++){ if(p>=(+s[i].min||0)) return [s[i].label||"—",GRADE_COLORS[i%GRADE_COLORS.length]]; }
  return ["—","#aaa"];
}
function scaleText(sc){
  const s=sortScale(sc);
  return s.map((b,i)=>{ const hi=i===0?100:(+s[i-1].min||0)-1; return (b.label||"—")+" = "+(+b.min||0)+"–"+hi+"%"; }).join(" · ");
}
/* One grading-key editor, used by the Gradebook and the Report Card — same stored scale, so the two never disagree. */
function GradeKeyEditor({gscale,setGscale,onClose}){
  const setBand=(i,k,v)=>setGscale(gscale.map((b,idx)=>idx===i?{...b,[k]:k==="min"?Math.max(0,Math.min(100,+v||0)):v}:b));
  const addBand=()=>{ const lows=sortScale(gscale); const last=lows[lows.length-1];
    setGscale([...gscale,{min:Math.max(0,(+last.min||10)-10),label:""}]);
    setTimeout(()=>{const els=document.querySelectorAll("[data-gband]");const l=els[els.length-1];l&&l.focus();},50); };
  const removeBand=i=>{ if(gscale.length<=1){toast("Keep at least one grade","⚠️");return;} setGscale(gscale.filter((_,idx)=>idx!==i)); };
  const resetScale=()=>{ setGscale(GRADE_DEFAULT); toast("Grading key reset","↩️"); };
  return (
    <div className="card no-print" style={{background:'var(--surface2)',margin:'6px 0 16px'}}>
      <div className="card-flex"><h3 style={{fontSize:14,marginBottom:0}}>🎯 Grading key</h3>
        {onClose && <button className="mini-btn ghost" onClick={onClose}>✕ Close</button>}</div>
      <p className="hint" style={{marginTop:6,marginBottom:10}}>Your school's own grades and the percentage each one starts at. Used everywhere marks are graded — the gradebook, printed report cards and CSV exports.</p>
      <table className="gtable" style={{maxWidth:430}}>
        <thead><tr><th style={{width:120}}>Grade</th><th>From %</th><th className="rc-gut no-print"></th></tr></thead>
        <tbody>
          {gscale.map((b,i)=><tr key={i}>
            <td><input className="tt-inp" data-gband style={{textAlign:'left',fontWeight:800}} placeholder="e.g. A+" value={b.label} onChange={e=>setBand(i,'label',e.target.value)}/></td>
            <td><input className="tt-inp" type="number" min="0" max="100" style={{maxWidth:90}} value={b.min} onChange={e=>setBand(i,'min',e.target.value)}/></td>
            <td className="rc-gut">{gscale.length>1 && <button className="rc-x" title="Remove this grade" onClick={()=>removeBand(i)}>−</button>}</td>
          </tr>)}
          <tr className="rc-add" onClick={addBand}><td colSpan={2}>＋&nbsp; Add a grade</td><td className="rc-gut"></td></tr>
        </tbody>
      </table>
      <p className="hint" style={{marginTop:10}}><b>Now reads:</b> {scaleText(gscale)} · anything below the lowest band shows as “—”.</p>
      <button className="mini-btn ghost" onClick={resetScale}>↩️ Reset to A / B / C / D</button>
    </div>
  );
}
const SUBJECT_POOL={
  early:["English","Urdu","Counting","General Knowledge","Rhymes","Art","Story Time"],
  primary:["English","Urdu","Maths","Islamiat","General Knowledge","Science","Social Studies","Computer","Nazra Quran","Art","P.E."]
};
function Gradebook({students,goReport}){
  const [cls,setCls]=useLS("gb:cls","Nursery");
  const [sec,setSec]=useLS("gb:sec","A");
  const [term,setTerm]=useLS("gb:term","1st Term");
  const [gb,setGb]=useLS("gradebook",{});
  const [newStu,setNewStu]=useState("");
  const [newSub,setNewSub]=useState("");
  const [gscale,setGscale]=useLS("gradeScale",GRADE_DEFAULT);
  const [keyEdit,setKeyEdit]=useState(false);
  const key=cls+" "+sec+"|"+term;
  const early=isEarly(cls);
  const sheet=gb[key]||{subjects:early?DEFAULT_SUBJECTS.early:DEFAULT_SUBJECTS.primary,rows:[]};
  const suggestions=(early?SUBJECT_POOL.early:SUBJECT_POOL.primary).filter(s=>sheet.subjects.indexOf(s)<0);
  const photoOf=name=>{const s=students.find(x=>x.name===name);return s?s.photo:null;};
  const avail=students.filter(s=>s.cls===cls&&s.sec===sec&&!sheet.rows.some(r=>r.name===s.name));
  const pickStudent=name=>{ if(!name)return; save({...sheet,rows:[...sheet.rows,{name,m:{}}]}); toast(name+" added","🎒"); };
  const pickSubject=s=>{ if(!s||sheet.subjects.indexOf(s)>=0)return; save({...sheet,subjects:[...sheet.subjects,s]}); toast(s+" column added","📚"); };
  const save=s=>setGb({...gb,[key]:s});
  const setMark=(ri,sub,v)=>{ const rows=sheet.rows.map((r,i)=>i===ri?{...r,m:{...r.m,[sub]:Math.max(0,Math.min(100,+v||0))}}:r); save({...sheet,rows}); };
  const addStudent=()=>{ if(!newStu.trim())return; save({...sheet,rows:[...sheet.rows,{name:newStu.trim(),m:{}}]}); setNewStu(""); };
  const importSMS=()=>{ const inCls=students.filter(s=>s.cls===cls&&s.sec===sec&&!sheet.rows.some(r=>r.name===s.name));
    if(inCls.length===0){toast("No new students found for "+cls+" "+sec,"ℹ️");return;}
    save({...sheet,rows:[...sheet.rows,...inCls.map(s=>({name:s.name,m:{}}))]}); toast(inCls.length+" students imported from School Management"); };
  const removeRow=ri=>save({...sheet,rows:sheet.rows.filter((_,i)=>i!==ri)});
  const addSubject=()=>{ const s=newSub.trim(); if(!s||sheet.subjects.indexOf(s)>=0)return; save({...sheet,subjects:[...sheet.subjects,s]}); setNewSub(""); };
  const removeSubject=sub=>save({...sheet,subjects:sheet.subjects.filter(s=>s!==sub),rows:sheet.rows.map(r=>{const m={...r.m};delete m[sub];return {...r,m};})});
  const total=r=>sheet.subjects.reduce((a,s)=>a+(+r.m[s]||0),0);
  const pct=r=>sheet.subjects.length?Math.round(total(r)/(sheet.subjects.length*100)*100):0;
  const grade=p=>gradeFor(gscale,p);
  const exportCSV=()=>downloadCSV("Gradebook_"+cls+"_"+sec+"_"+term.replace(/ /g,"_")+".csv",
    [["Student",...sheet.subjects,"Total","%","Grade","Position","Class Average"],...sheet.rows.map(r=>[r.name,...sheet.subjects.map(s=>r.m[s]||0),total(r),pct(r)+"%",grade(pct(r))[0],rankOf(r),classAvg+"%"])]);
  const classAvg=sheet.rows.length?Math.round(sheet.rows.reduce((a,r)=>a+pct(r),0)/sheet.rows.length):0;
  /* class position — equal totals share a position, the way schools actually rank */
  const rankOf=(()=>{ const sorted=[...sheet.rows].map(r=>total(r)).sort((a,b)=>b-a);
    return r=>{ const t=total(r); if(!sheet.subjects.length) return "—";
      const i=sorted.indexOf(t); return i<0?"—":String(i+1); }; })();
  return (
   <div>
    <div className="page-head"><h2>📊 Class Gradebook</h2>
      <p>Marks save automatically on this device. Pick a class, section and term — every combination keeps its own sheet.</p></div>
    <div className="card">
      <div className="rc-toolbar">
        <select className="tt-sel" value={cls} onChange={e=>setCls(e.target.value)}>{TT_CLASSES.map(c=><option key={c}>{c}</option>)}</select>
        <select className="tt-sel" value={sec} onChange={e=>setSec(e.target.value)}>{TT_SECTIONS.map(s=><option key={s}>Sec {s}</option>)}</select>
        <select className="tt-sel" value={term} onChange={e=>setTerm(e.target.value)}>{GB_TERMS.map(t=><option key={t}>{t}</option>)}</select>
        <button className="mini-btn ghost" onClick={importSMS}>👥 Import class students</button>
        <button className="mini-btn ghost" onClick={exportCSV}>📥 Export CSV</button>
        <button className="mini-btn ghost" onClick={()=>setKeyEdit(v=>!v)}>{keyEdit?"✕ Close grading key":"🎯 Grading key"}</button>
        {sheet.rows.length>0&&<span style={{fontSize:12,fontWeight:800,color:'var(--muted)',marginLeft:'auto'}}>{sheet.rows.length} students · avg {classAvg}% · 🏆 {sheet.rows.filter(r=>pct(r)>=80).length} · 📉 {sheet.rows.filter(r=>pct(r)>0&&pct(r)<50).length}</span>}
      </div>

      {keyEdit && <GradeKeyEditor gscale={gscale} setGscale={setGscale}/>}
      <details className="disc"><summary>＋ Add a student or subject</summary>
        <div className="disc-b">
        <div className="quick-add" style={{marginBottom:8}}>
          <select className="tt-sel" value="" onChange={e=>pickStudent(e.target.value)} style={{minWidth:220}}>
            <option value="">🎒 Pick a student — {avail.length} in {cls} {sec} (School Management)…</option>

                <button className="del-btn" title="Remove student" onClick={()=>removeRow(ri)}>✕</button></td>
            </tr>);})}
        </tbody>

function ReportCard({prefill,students,schoolName}){
