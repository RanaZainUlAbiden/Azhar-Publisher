<!DOCTYPE html>
<html lang="ur" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Islamiyat (DCTE) — Grade 4 (DCTE) — انٹرایکٹو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b5460;--a:#127a8a;--a2:#0e6675;--soft:#e3f3f6;--ink:#0a3f49;}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq',serif;background:radial-gradient(120% 120% at 80% 0,var(--a2),var(--bg));min-height:100vh;color:#233;
 display:flex;align-items:center;justify-content:center;padding:16px;line-height:2.15}
.card{background:#fff;width:min(820px,97vw);border-radius:26px;box-shadow:0 26px 70px rgba(0,0,0,.32);overflow:hidden;position:relative}
.hd{background:linear-gradient(90deg,var(--a),var(--a2));color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hd .t{font-size:19px;font-weight:700;max-width:60%}
.hd .stat{display:flex;gap:14px;font-family:system-ui;font-size:14px;align-items:center}
.hd .stat b{font-size:17px}
.dots{display:flex;gap:6px;padding:10px 22px 0;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--soft);display:inline-block;transition:.3s}
.dots i.on{background:var(--a);transform:scale(1.15)}
.dots i.ok{background:#3aa76d}.dots i.no{background:#e08a86}
.body{padding:16px 26px 28px;min-height:360px}
.scr{display:none;animation:fade .32s}
.scr.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.chip-ch{display:inline-block;background:var(--soft);color:var(--ink);font-size:15px;font-weight:700;padding:3px 16px;border-radius:20px;margin:2px 0 8px}
.big{font-size:38px;font-weight:700;color:var(--ink);text-align:center;margin:14px 0 4px;animation:pop .5s}
.sub{text-align:center;color:#5a6b63;font-size:17px;margin-bottom:8px}
.hero{font-size:70px;text-align:center;margin:10px 0 0;animation:pop .6s}
.chips-info{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 6px}
.pill{background:var(--soft);color:var(--ink);border-radius:16px;padding:8px 16px;font-size:16px;font-weight:700}
.q{font-size:26px;font-weight:700;color:var(--ink);margin:4px 0 16px;text-align:center}
.arb{font-family:'Noto Naskh Arabic',serif;font-size:30px;line-height:2.4;direction:rtl}
.opts{display:grid;gap:11px}
.opt{background:var(--soft);border:2px solid transparent;border-radius:16px;padding:11px 18px;font:inherit;font-size:21px;cursor:pointer;text-align:right;transition:.15s}
.opt:hover{border-color:var(--a);transform:translateX(-3px)}
.opt.ok{background:#dff5e6;border-color:#3aa76d;color:#1c6b3f}
.opt.no{background:#fde4e1;border-color:#d9534f;color:#a12a25}
.opt[disabled]{cursor:default;opacity:.9}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.col{display:grid;gap:10px}
.chip{background:var(--soft);border:2px solid transparent;border-radius:14px;padding:10px 14px;font:inherit;font-size:19px;cursor:pointer;text-align:center;transition:.15s}
.chip:hover{border-color:var(--a)}
.chip.sel{border-color:var(--a);background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.chip.done{background:#dff5e6;border-color:#3aa76d;color:#1c6b3f;cursor:default}
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
.bucket{border:2px dashed var(--a);border-radius:16px;padding:10px;min-height:120px}
.bucket h4{margin:2px 0 8px;text-align:center;color:var(--ink);font-size:19px}
.bucket .drop{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:6px 0 4px}
.tag{background:#fff;border:2px solid var(--a);border-radius:14px;padding:8px 14px;font:inherit;font-size:19px;cursor:pointer}
.tag.sel{background:var(--a);color:#fff}
.tag.placed{background:#dff5e6;border-color:#3aa76d;color:#1c6b3f;cursor:default}
.slots{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.slot{min-width:120px;background:var(--soft);border-radius:14px;padding:8px 12px;font-size:19px;text-align:center;border:2px dashed transparent}
.slot .n{font-family:system-ui;font-size:12px;color:#999;display:block}
.fill-s{font-size:25px;text-align:center;color:var(--ink);margin:6px 0 14px}
.blank{display:inline-block;min-width:90px;border-bottom:3px dashed var(--a);margin:0 6px;color:var(--a)}
.fb{min-height:26px;text-align:center;font-size:20px;font-weight:700;margin-top:12px}
.fb.g{color:#2c8f57}.fb.r{color:#c8443f}
.ex{background:var(--soft);border-radius:14px;padding:8px 16px;margin-top:10px;font-size:17px;color:var(--ink);text-align:center;display:none}
.ex.show{display:block;animation:fade .3s}
.btn{display:block;margin:16px auto 0;background:var(--a);color:#fff;border:none;border-radius:16px;padding:12px 42px;font:inherit;font-size:21px;font-weight:700;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.16)}
.btn.ghost{background:#fff;color:var(--a);border:2px solid var(--a);box-shadow:none;padding:8px 22px;font-size:17px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:8px}
.score{font-size:66px;font-weight:700;color:var(--a);text-align:center;margin:6px 0}
.stars{font-size:44px;text-align:center;letter-spacing:8px;margin:2px 0 8px}
.foot{text-align:center;color:#8a938d;font-size:13px;margin-top:16px;font-family:system-ui}
.badge{display:inline-block;background:var(--soft);color:var(--ink);border-radius:20px;padding:6px 16px;margin:4px;font-size:15px;font-weight:700}
.brandrow{display:flex;gap:14px;justify-content:center;align-items:center;background:#fff;border:1px solid #eee;border-radius:16px;padding:10px 18px;margin:2px auto 6px;width:max-content;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.brandrow img{height:44px;width:auto;object-fit:contain}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 22px;border-top:1px solid #eef1f0;background:#fafcfb}
.nav.hide{display:none}
.nbtn{background:#fff;border:2px solid var(--a);color:var(--a);border-radius:14px;padding:8px 22px;font:inherit;font-size:18px;font-weight:700;cursor:pointer}
.nbtn:hover{background:var(--soft)}
.nbtn:disabled{opacity:.35;cursor:not-allowed}
.navlbl{font-family:system-ui;font-size:14px;color:#8a938d}
</style></head>

ACT.forEach(()=>{const i=document.createElement('i');dots.appendChild(i);});
function paintDots(){[...dots.children].forEach((d,i)=>{d.className=(i===idx?'on':(i<idx&&ACT[i]._ans?(ACT[i]._ok?'ok':'no'):''));});}
function setStat(){ptsEl.textContent=UD(pts);stkEl.textContent=UD(streak);}
/* sound */
let actx=null;function beep(ok){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.type='sine';const t=actx.currentTime;if(ok){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(880,t+.09);}else{o.frequency.setValueAtTime(200,t);}g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.start(t);o.stop(t+.3);}catch(e){}}
function award(ok){if(ok){correct++;streak++;best=Math.max(best,streak);pts+=10+(streak>=3?5:0);}else{streak=0;}setStat();beep(ok);}
function chLabel(a){return a.ch?`<div class="chip-ch">${a.ch}</div>`:'';}
function nextBtn(){const b=document.createElement('button');b.className='btn';b.textContent=idx===TOTAL-1?'نتیجہ دیکھیں 🎉':'اگلا ▶';b.onclick=()=>{idx++;render();};return b;}
function showEx(a){if(a.ex){const e=document.createElement('div');e.className='ex show';e.innerHTML='💡 '+a.ex;stage.querySelector('.scr').appendChild(e);}}
function finishOne(a,ok){a._ok=ok;a._ans=true;award(ok);showEx(a);stage.querySelector('.scr').appendChild(nextBtn());paintDots();}

const nav=document.getElementById('nav'),navPrev=document.getElementById('navPrev'),navNext=document.getElementById('navNext'),navlbl=document.getElementById('navlbl');
navPrev.onclick=()=>{ if(idx<=0){intro();} else {idx--;render();} };
navNext.onclick=()=>{ idx++; render(); };   // move on WITHOUT answering
function updateNav(show){ if(!show){nav.classList.add('hide');return;} nav.classList.remove('hide');
 navPrev.textContent = idx===0 ? '← شروع' : '← پچھلا';
 navNext.textContent = idx===TOTAL-1 ? 'نتیجہ →' : 'آگے →';
 navlbl.textContent = 'سرگرمی '+UD(idx+1)+' / '+UD(TOTAL); }

function intro(){idx=-1;pts=0;streak=0;correct=0;setStat();paintDots();updateNav(false);
 stage.innerHTML=`<div class="scr on"><div class="brandrow"><img src="${AZHAR}" alt="Azhar Publishers"><img src="${BF}" alt="Book Factory"></div>
 <div class="hero">${HERO}</div><div class="big">${TITLE}</div>
 <div class="sub">${INTRO}</div>
 <div class="chips-info"><span class="pill">${UD(CHAPTERS)} ابواب</span><span class="pill">${UD(TOTAL)} سرگرمیاں</span><span class="pill">⭐ ستارے جیتیں</span></div>
 <button class="btn" id="go">شروع کریں ▶</button>
 <div class="foot">Alfatah Series · Azhar Publishers &amp; Book Factory</div></div>`;
 document.getElementById('go').onclick=()=>{idx=0;render();};}

function render(){ if(idx>=TOTAL) return result(); if(idx<0){return intro();} paintDots(); updateNav(true);
 const a=ACT[idx]; ({mcq:mcq,tf:mcq,match:match,sort:sort,order:order,fill:fill})[a.type](a); }

function mcq(a){
 const q = a.arb ? `<div class="q">${a.q}</div><div class="arb" style="text-align:center;margin-bottom:12px">${a.arb}</div>` : `<div class="q">${a.q}</div>`;
 stage.innerHTML=`<div class="scr on">${chLabel(a)}${q}<div class="opts">${a.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`;
 let done=false;const fb=document.getElementById('fb');
 stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;done=true;const i=+b.dataset.i;
  stage.querySelectorAll('.opt').forEach(x=>x.disabled=true);
  if(i===a.c){b.classList.add('ok');fb.className='fb g';fb.textContent='شاباش! ✔';finishOne(a,true);}
  else{b.classList.add('no');stage.querySelector(`[data-i="${a.c}"]`).classList.add('ok');fb.className='fb r';fb.textContent='درست جواب نمایاں ہے';finishOne(a,false);}});
}
function match(a){
 const L=a.pairs.map(p=>p[0]);let R=a.pairs.map(p=>p[1]);for(let i=R.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[R[i],R[j]]=[R[j],R[i]];}
 const map={};a.pairs.forEach(p=>map[p[0]]=p[1]);
 stage.innerHTML=`<div class="scr on">${chLabel(a)}<div class="q">${a.q}</div>
  <div class="pairs"><div class="col" id="cl"></div><div class="col" id="cr"></div></div><div class="fb" id="fb"></div></div>`;
 const cl=cId('cl'),cr=cId('cr'),fb=cId('fb');
 L.forEach(t=>cl.appendChild(mk('chip',t,{k:t})));R.forEach(t=>cr.appendChild(mk('chip',t,{v:t})));
 let sel=null,m=0;
 cl.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{if(c.classList.contains('done'))return;cl.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');sel=c;});
 cr.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{if(c.classList.contains('done')||!sel)return;
   if(map[sel.dataset.k]===c.dataset.v){sel.classList.add('done');c.classList.add('done');sel.classList.remove('sel');sel=null;m++;beep(true);
     if(m===a.pairs.length){fb.className='fb g';fb.textContent='سب جوڑے درست ✔';finishOne(a,true);}}
   else{fb.className='fb r';fb.textContent='یہ جوڑا درست نہیں';beep(false);}});
}
function sort(a){
 const items=[];Object.keys(a.groups).forEach(g=>a.groups[g].forEach(it=>items.push([it,g])));
 for(let i=items.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[items[i],items[j]]=[items[j],items[i]];}
 const gk=Object.keys(a.groups);
 stage.innerHTML=`<div class="scr on">${chLabel(a)}<div class="q">${a.q}</div>
  <div class="pool" id="pool"></div>
  <div class="buckets">${gk.map((g,i)=>`<div class="bucket"><h4>${g}</h4><div class="drop" id="d${i}"></div></div>`).join('')}</div>
  <div class="fb" id="fb"></div></div>`;
 const pool=cId('pool'),fb=cId('fb');let sel=null,placed=0,wrong=0;
 items.forEach(([it,g])=>{const t=mk('tag',it,{g:g});pool.appendChild(t);t.onclick=()=>{if(t.classList.contains('placed'))return;pool.querySelectorAll('.tag').forEach(x=>x.classList.remove('sel'));t.classList.add('sel');sel=t;};});
 gk.forEach((g,i)=>{cId('d'+i).parentElement.onclick=()=>{if(!sel)return;const ok=sel.dataset.g===g;
   if(ok){cId('d'+i).appendChild(sel);sel.classList.remove('sel');sel.classList.add('placed');sel=null;placed++;beep(true);
     if(placed===items.length){fb.className='fb g';fb.textContent=wrong?'مکمل!':'سب درست ✔';finishOne(a,wrong===0);}}
   else{wrong++;fb.className='fb r';fb.textContent='یہ یہاں نہیں آتا — دوبارہ سوچیں';beep(false);}};});
}
function order(a){
 let sh=a.seq.slice();for(let i=sh.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[sh[i],sh[j]]=[sh[j],sh[i]];}
 stage.innerHTML=`<div class="scr on">${chLabel(a)}<div class="q">${a.q}</div>
  <div class="slots" id="slots">${a.seq.map((_,i)=>`<div class="slot" id="s${i}"><span class="n">${UD(i+1)}</span>—</div>`).join('')}</div>
  <div class="pool" id="pool"></div><div class="fb" id="fb"></div></div>`;
 const pool=cId('pool'),fb=cId('fb');let pos=0;
 sh.forEach(t=>{const tag=mk('tag',t,{});pool.appendChild(tag);tag.onclick=()=>{if(tag.classList.contains('placed')||pos>=a.seq.length)return;
   const slot=cId('s'+pos);slot.innerHTML=`<span class="n">${UD(pos+1)}</span>${t}`;slot.dataset.val=t;tag.classList.add('placed');pos++;beep(true);
   if(pos===a.seq.length){const ok=a.seq.every((v,i)=>cId('s'+i).dataset.val===v);
     if(ok){fb.className='fb g';fb.textContent='ترتیب درست ✔';}else{fb.className='fb r';fb.textContent='درست ترتیب: '+a.seq.join(' ◂ ');}finishOne(a,ok);}};});
 const rb=document.createElement('button');rb.className='btn ghost';rb.textContent='دوبارہ ترتیب دیں ↺';
 rb.onclick=()=>order(a);stage.querySelector('.scr').insertBefore(rb,fb.nextSibling? fb: null)||stage.querySelector('.scr').appendChild(rb);
}
function fill(a){
 stage.innerHTML=`<div class="scr on">${chLabel(a)}<div class="fill-s">${a.s.replace('___','<span class="blank">؟</span>')}</div>
  <div class="opts">${a.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`;
 let done=false;const fb=cId('fb');
 stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;done=true;const i=+b.dataset.i;stage.querySelectorAll('.opt').forEach(x=>x.disabled=true);
  if(i===a.c){b.classList.add('ok');stage.querySelector('.blank').textContent=a.opts[a.c];stage.querySelector('.blank').style.color='#2c8f57';fb.className='fb g';fb.textContent='درست ✔';finishOne(a,true);}
  else{b.classList.add('no');stage.querySelector(`[data-i="${a.c}"]`).classList.add('ok');stage.querySelector('.blank').textContent=a.opts[a.c];fb.className='fb r';fb.textContent='درست لفظ نمایاں ہے';finishOne(a,false);}});
}
function cId(x){return document.getElementById(x);}
function mk(cls,txt,data){const d=document.createElement('button');d.className=cls;d.textContent=txt;for(const k in data)d.dataset[k]=data[k];return d;}
function result(){paintDots();updateNav(false);
 const pct=Math.round(100*correct/TOTAL),st=pct>=80?'⭐⭐⭐':pct>=50?'⭐⭐':'⭐';
 const msg=pct>=80?'بہت شاندار!':pct>=50?'اچھی کوشش!':'اچھی شروعات!';
 stage.innerHTML=`<div class="scr on"><div class="hero">🏆</div><div class="big">${msg}</div>
  <div class="sub">${TITLE} — سرگرمیاں مکمل</div>
  <div class="score">${UD(correct)} / ${UD(TOTAL)}</div><div class="stars">${st}</div>
  <div style="text-align:center"><span class="badge">⭐ کل ${UD(pts)} پوائنٹس</span><span class="badge">🔥 بہترین سلسلہ ${UD(best)}</span></div>
  <button class="btn" id="again">دوبارہ کھیلیں ↺</button>
  <div class="foot">Alfatah Series · Azhar Publishers &amp; Book Factory</div></div>`;
 cId('again').onclick=intro;
}
intro();
</script></body></html>
