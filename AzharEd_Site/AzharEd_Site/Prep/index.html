<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;
const D = window.PREP;
/* ---------- storage layer (localStorage now; the same calls map to Supabase tables later) ---------- */
const KEY = 'mprep:';
const ls = { get: (k, d) => { try { const v = localStorage.getItem(KEY + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set: (k, v) => { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} } };
function useLS(k, d) { const [v, setV] = useState(() => ls.get(k, d)); useEffect(() => ls.set(k, v), [k, v]); return [v, setV]; }
const uid = () => Math.random().toString(36).slice(2, 10);
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmt = n => 'Rs ' + Number(n || 0).toLocaleString('en-PK');
const boardName = id => (D.BOARDS.find(b => b.id === id) || {}).name || id;
const levelName = id => (D.LEVELS.find(l => l.id === id) || {}).name || id;
const subjectsFor = (level, group) => D.SUBJECTS[level + '|' + group] || [];
const subjName = (level, group, id) => (subjectsFor(level, group).find(s => s.id === id) || { name: id }).name;
const patternFor = (level, group, sid) => D.PATTERNS[(subjectsFor(level, group).find(s => s.id === sid) || {}).pat] || D.PATTERNS.matric_sci;
const chaptersFor = (sid, level) => D.CHAPTERS[sid + '|' + level] || ['Chapter 1', 'Chapter 2', 'Chapter 3', 'Chapter 4', 'Chapter 5', 'Chapter 6', 'Chapter 7', 'Chapter 8'];
const chName = (sid, level, ch) => ch == null ? 'General' : (chaptersFor(sid, level)[ch] || 'Chapter ' + (ch + 1));
const usable = q => q.type !== 'mcq' || (Array.isArray(q.opts) && q.opts.length === 4);
/* lazy per-class question bank: bank/<level>.js defines window.PREP_BANK_<level> */
const bankCache = {};
function loadBank(level) { if (bankCache[level]) return bankCache[level]; bankCache[level] = new Promise((res, rej) => { if (window['PREP_BANK_' + level]) return res(window['PREP_BANK_' + level]); const sc = document.createElement('script'); sc.src = 'bank/' + level + '.js?v=' + ((window.PREP_INDEX || {}).build || '1'); sc.onload = () => res(window['PREP_BANK_' + level] || []); sc.onerror = () => res([]); document.head.appendChild(sc); }); return bankCache[level]; }
function useBank(levels, extraBank, overrides) {
  const [loaded, setLoaded] = useState({}); const key = levels.join(',');
  useEffect(() => { let alive = true; Promise.all(levels.map(l => loadBank(l).then(b => [l, b]))).then(xs => { if (alive) setLoaded(Object.fromEntries(xs)); }); return () => { alive = false; }; }, [key]);
  const ready = levels.every(l => loaded[l]);
  const bank = useMemo(() => [...levels.flatMap(l => loaded[l] || []), ...extraBank].map(q => overrides[q.id] ? { ...q, ...overrides[q.id] } : q), [loaded, extraBank, overrides]);
  return [bank, ready];
}
function useToast() { const [t, setT] = useState(null); const show = (m) => { setT(m); setTimeout(() => setT(null), 2400); }; return [t, show]; }
const Icon = ({ e }) => <span style={{ fontSize: 18 }}>{e}</span>;

/* ---------- auth + onboarding ---------- */
function Landing({ onAuth }) {
  const [mode, setMode] = useState('up'); const [f, setF] = useState({ name: '', phone: '', email: '', pass: '' }); const [err, setErr] = useState('');
  const users = ls.get('users', []);
  const go = () => {
    setErr('');
    if (mode === 'up') { if (!f.name || !f.phone || !f.pass) return setErr('Name, phone and password are needed.'); if (users.find(u => u.phone === f.phone)) return setErr('This phone already has an account — sign in instead.'); const u = { id: uid(), name: f.name, phone: f.phone, email: f.email, pass: f.pass, role: 'student', created: todayISO() }; ls.set('users', [...users, u]); onAuth(u); }
    else { const u = users.find(x => (x.phone === f.phone || x.email === f.phone) && x.pass === f.pass); if (!u) { if (f.phone === 'admin' && f.pass === 'admin') return onAuth({ id: 'admin', name: 'Admin', role: 'admin' }); return setErr('Wrong phone/email or password.'); } onAuth(u); }

function Onboard({ user, onDone }) {
  const [step, setStep] = useState(0); const [level, setLevel] = useState(null); const [board, setBoard] = useState(null); const [group, setGroup] = useState(null); const [exam, setExam] = useState('');
  const lv = D.LEVELS.find(l => l.id === level);
  return <div className="main" style={{ maxWidth: 760 }}>
    <div className="kick">Set up your practice</div><h1 style={{ fontSize: 30, margin: '6px 0 0' }}>Hi {user.name.split(' ')[0]} — which exam are you preparing for?</h1>
    <div className="steps">{[0, 1, 2, 3].map(i => <i key={i} className={i <= step ? 'on' : ''}></i>)}</div>
    {step === 0 && <div className="grid g2">{D.LEVELS.map(l => <div key={l.id} className={'big-choice' + (level === l.id ? ' on' : '')} onClick={() => { setLevel(l.id); setBoard(null); setGroup(null); setStep(1); }}><h3>{l.name}</h3><div className="muted small">{l.long}</div></div>)}</div>}
    {step === 1 && lv && <div><h3 style={{ marginBottom: 10 }}>Your board</h3><div className="grid g2">{lv.boards.map(b => <div key={b} className={'big-choice' + (board === b ? ' on' : '')} onClick={() => { setBoard(b); setStep(2); }}><h3>{boardName(b)}</h3></div>)}</div><button className="btn ghost sm" style={{ marginTop: 14 }} onClick={() => setStep(0)}>← Back</button></div>}
    {step === 2 && lv && <div><h3 style={{ marginBottom: 10 }}>Your group</h3><div className="grid g3">{lv.groups.map(g => <div key={g} className={'big-choice' + (group === g ? ' on' : '')} onClick={() => { setGroup(g); setStep(3); }}><h3>{D.GROUPS[g]}</h3><div className="muted small">{subjectsFor(level, g).map(s => s.name).join(' · ')}</div></div>)}</div><button className="btn ghost sm" style={{ marginTop: 14 }} onClick={() => setStep(1)}>← Back</button></div>}
    {step === 3 && <div className="card"><h3>When is your exam?</h3><p className="muted small">Optional — we count down the days and pace your practice.</p><div className="field"><label>Exam date</label><input type="date" value={exam} onChange={e => setExam(e.target.value)} /></div>
      <div className="row"><button className="btn gold lg" onClick={() => onDone({ level, board, group, exam })}>Let’s go →</button><button className="btn ghost" onClick={() => setStep(2)}>← Back</button></div></div>}
  </div>;
}

/* ---------- subscription ---------- */
function subStatus(user, subs) { const s = subs.filter(x => x.userId === user.id).sort((a, b) => b.created.localeCompare(a.created))[0]; if (!s) return { state: 'free' }; if (s.status === 'approved' && s.until >= todayISO()) return { state: 'pro', until: s.until }; if (s.status === 'pending') return { state: 'pending', sub: s }; return { state: 'free', expired: s.status === 'approved' }; }
function Subscribe({ user, subs, setSubs, toast, onBack }) {
  const st = subStatus(user, subs); const [plan, setPlan] = useState('y'); const [tid, setTid] = useState(''); const [via, setVia] = useState('jazzcash');
  const p = D.PLANS.find(x => x.id === plan);
  const submit = () => { if (!tid.trim()) return toast('Enter the transaction ID from your payment app'); setSubs([...subs, { id: uid(), userId: user.id, userName: user.name, phone: user.phone, plan, amount: p.price, via, tid: tid.trim(), status: 'pending', created: new Date().toISOString(), until: null }]); toast('Sent — we will unlock your account within a few hours'); };
  return <div className="main" style={{ maxWidth: 860 }}>

/* ---------- attempt engine ---------- */
function buildFromPaper(paper, bank) { const byId = Object.fromEntries(bank.map(q => [q.id, q])); return paper.sections.map(s => ({ ...s, qs: s.qs.map(id => byId[id]).filter(q => q && usable(q)) })).filter(s => s.qs.length); }

function Generator({ prof, bank, go, toast }) {
  const subjects = subjectsFor(prof.level, prof.group); const [sid, setSid] = useState(subjects[0]?.id); const [chs, setChs] = useState([]); const [n, setN] = useState({ mcq: 12, short: 8, long: 3 }); const [paper, setPaper] = useState(null); const [solved, setSolved] = useState(false);

  useEffect(() => { setN({ mcq: pat.obj.count, short: pat.subj.short.reduce((a, s) => a + s.of, 0), long: pat.subj.long.of }); }, [sid]);
  const pool = t => bank.filter(q => q.subject === sid && q.level === prof.level && q.type === t && usable(q) && (!chs.length || chs.includes(q.ch)));
  const [layout, setLayout] = useState('board');
  const gen = () => {
    const shuffle = a => [...a].sort(() => Math.random() - .5);
    const used = new Set(); const take = (t, k, chSet) => { const out = []; for (const q of shuffle(pool(t).filter(q => !chSet || chSet.includes(q.ch)))) { if (out.length >= k) break; if (used.has(q.id)) continue; used.add(q.id); out.push(q); } return out; };

    } else {
      secs = [{ key: 'obj', title: 'Objective · MCQs', qs: take('mcq', n.mcq) }, { key: 'short', title: 'Subjective · Short questions', qs: take('short', n.short) }, { key: 'long', title: 'Subjective · Long questions', qs: take('long', n.long) }];

}
function PaperSheet({ paper, prof, sid, pat, solved }) {

    <div style={{ marginTop: 20, fontSize: 11, textAlign: 'center', color: '#666' }}>Generated with MAKTAB Prep · maktabedtech.com{solved ? ' · answer key' : ''}</div></div>;
}
function Progress({ user, prof, attempts, bank }) {
  const mine = attempts.filter(a => a.userId === user.id).sort((a, b) => b.when.localeCompare(a.when)); const subjects = subjectsFor(prof.level, prof.group);
  const per = subjects.map(s => { const xs = mine.filter(a => a.subject === s.id); const pct = xs.length ? Math.round(xs.reduce((a, b) => a + 100 * b.got / b.total, 0) / xs.length) : null; return { ...s, pct, n: xs.length }; });
  const weak = {}; for (const a of mine) for (const [ch, v] of Object.entries(a.perCh || {})) { const k = a.subject + '|' + ch; weak[k] = weak[k] || { got: 0, total: 0, subject: a.subject, ch: Number(ch) }; weak[k].got += v.got; weak[k].total += v.total; }
  const weakList = Object.values(weak).map(w => ({ ...w, pct: Math.round(100 * w.got / Math.max(1, w.total)) })).sort((a, b) => a.pct - b.pct).slice(0, 6);

    <div className="card" style={{ marginTop: 14 }}><h3>All attempts</h3><table className="table"><thead><tr><th>When</th><th>Paper</th><th>Score</th><th>%</th></tr></thead><tbody>{mine.map(a => <tr key={a.id}><td>{a.when.slice(0, 10)}</td><td>{a.title}</td><td>{a.got} / {a.total}</td><td><b>{Math.round(100 * a.got / a.total)}%</b></td></tr>)}{!mine.length && <tr><td colSpan="4" className="muted">Nothing yet — your first attempt will appear here.</td></tr>}</tbody></table></div></div>;
}

  const approve = (s, ok) => { const p = D.PLANS.find(x => x.id === s.plan); const until = new Date(); until.setDate(until.getDate() + (p ? p.days : 31)); setSubs(subs.map(x => x.id === s.id ? { ...x, status: ok ? 'approved' : 'rejected', until: ok ? until.toISOString().slice(0, 10) : null } : x)); toast(ok ? 'Approved — Pro unlocked' : 'Rejected'); };
  // new paper form

  const parse = txt => { // simple text format: lines starting with MCQ:/SHORT:/LONG:, options as A) .. , answer as ANS: B, chapter as CH: 2, model as MODEL: ...
    const out = []; let cur = null; const push = () => { if (cur) { out.push(cur); cur = null; } };
    for (const raw of txt.split('\n')) { const line = raw.trim(); if (!line) continue; const m = line.match(/^(MCQ|SHORT|LONG):\s*(.*)$/i); if (m) { push(); cur = { type: m[1].toLowerCase(), text: m[2], opts: [], ans: null, ch: 0, model: '' }; continue; } if (!cur) continue; const o = line.match(/^([A-D])[\)\.]\s*(.*)$/i); if (o) { cur.opts.push(o[2]); continue; } const a = line.match(/^ANS:\s*([A-D])/i); if (a) { cur.ans = 'ABCD'.indexOf(a[1].toUpperCase()); continue; } const c = line.match(/^CH:\s*(\d+)/i); if (c) { cur.ch = Number(c[1]) - 1; continue; } const md = line.match(/^MODEL:\s*(.*)$/i); if (md) { cur.model = md[1]; continue; } cur.text += ' ' + line; } push(); return out; };
  const savePaper = () => { const qs = parse(np.text); if (!qs.length && !np.pdf) return toast('Paste questions or attach the PDF'); const newQ = qs.map(q => ({ id: 'q' + uid(), subject: np.subject, level: np.level, ch: q.ch, type: q.type, text: q.text, opts: q.type === 'mcq' ? q.opts : null, ans: q.type === 'mcq' ? q.ans : null, model: q.model, sample: false })); const p = { id: 'p' + uid(), board: np.board, level: np.level, subject: np.subject, year: Number(np.year), group: np.grp, sample: false, pdf: np.pdf, sections: [{ key: 'obj', title: 'Objective · MCQs', qs: newQ.filter(q => q.type === 'mcq').map(q => q.id) }, { key: 'short', title: 'Subjective · Short questions', qs: newQ.filter(q => q.type === 'short').map(q => q.id) }, { key: 'long', title: 'Subjective · Long questions', qs: newQ.filter(q => q.type === 'long').map(q => q.id) }] }; setBank([...bank, ...newQ]); setPapers([...papers, p]); setNp({ ...np, text: '', pdf: null }); toast(`Paper added with ${newQ.length} questions`); };
  const onPdf = e => { const f = e.target.files[0]; if (!f) return; if (f.size > 8e6) return toast('PDF too large for this preview build (8 MB max)'); const r = new FileReader(); r.onload = () => setNp({ ...np, pdf: r.result }); r.readAsDataURL(f); };

  return <div className="main"><div className="row" style={{ justifyContent: 'space-between' }}><div><div className="kick">Admin</div><h1 style={{ fontSize: 26 }}>MAKTAB Prep · office</h1></div><button className="btn ghost sm" onClick={onExit}>Sign out</button></div>
    <div className="row" style={{ margin: '12px 0 16px' }}>{[['subs', '💳 Subscriptions'], ['papers', '📄 Papers'], ['add', '➕ Add a paper'], ['bank', '🗂️ Question bank'], ['students', '🎓 Students']].map(([k, l]) => <span key={k} className={'chip' + (tab === k ? ' on' : '')} onClick={() => setTab(k)}>{l}</span>)}</div>
    {tab === 'subs' && <div className="card"><h3>Payments to approve</h3><table className="table"><thead><tr><th>Student</th><th>Phone</th><th>Plan</th><th>Via · TID</th><th>Status</th><th></th></tr></thead><tbody>{[...subs].reverse().map(s => <tr key={s.id}><td>{s.userName}</td><td>{s.phone}</td><td>{(D.PLANS.find(p => p.id === s.plan) || {}).name} · {fmt(s.amount)}</td><td>{s.via} · <b>{s.tid}</b></td><td><span className={'pill' + (s.status === 'approved' ? '' : s.status === 'pending' ? ' sample' : '')}>{s.status}{s.until ? ' → ' + s.until : ''}</span></td><td>{s.status === 'pending' && <div className="row"><button className="btn teal sm" onClick={() => approve(s, true)}>Approve</button><button className="btn ghost sm" onClick={() => approve(s, false)}>Reject</button></div>}</td></tr>)}{!subs.length && <tr><td colSpan="6" className="muted">No payments yet.</td></tr>}</tbody></table></div>}
    {tab === 'papers' && <div className="card"><h3>All papers · {papers.length}</h3><table className="table"><thead><tr><th>Board</th><th>Class</th><th>Subject</th><th>Year</th><th>Group</th><th>Qs</th><th>PDF</th><th></th></tr></thead><tbody>{papers.map(p => <tr key={p.id}><td>{boardName(p.board)}</td><td>{levelName(p.level)}</td><td>{p.subject}</td><td>{p.year}</td><td>{p.title || p.group}</td><td>{p.sections.reduce((a, s) => a + s.qs.length, 0)}</td><td>{p.pdf ? '✓' : '—'}</td><td>{p.sample ? <span className="pill sample">sample</span> : <button className="btn ghost sm" onClick={() => { if (confirm('Remove this paper?')) setPapers(papers.filter(x => x.id !== p.id)); }}>Remove</button>}</td></tr>)}</tbody></table></div>}

/* ---------- app shell ---------- */
function App() {
  const [user, setUser] = useLS('session', null); const [profiles, setProfiles] = useLS('profiles', {}); const [subs, setSubs] = useLS('subs', []); const [attempts, setAttempts] = useLS('attempts', []);

  const [overrides, setOverrides] = useLS('overrides', {});
  const papers = useMemo(() => [...D.PAPERS, ...extraPapers].filter(p => !removed.includes(p.id)), [extraPapers, removed]);
  const prof0 = user && user.role !== 'admin' ? profiles[user.id] : null;
  const levels = user ? (user.role === 'admin' ? D.LEVELS.map(l => l.id).filter(l => (D.QCOUNTS || {})[l]) : (prof0 ? [prof0.level] : [])) : [];
  const [bank, bankReady] = useBank(levels, extraBank, overrides);
  const setPapers = ps => { setExtraPapers(ps.filter(p => !p.sample)); setRemoved([...removed, ...papers.filter(p => !ps.find(x => x.id === p.id)).map(p => p.id)]); }; const setBank = b => setExtraBank(b.filter(q => !q.sample));
  const [page, setPage] = useState('home'); const [arg, setArg] = useState(null); const [toast, show] = useToast();
