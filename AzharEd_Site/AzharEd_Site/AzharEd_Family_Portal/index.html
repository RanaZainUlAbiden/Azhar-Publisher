<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>MAKTAB Family — read, play & practise at home</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="../AzharEd_Deploy/content_data.js"></script>
<script src="../AzharEd_Deploy/question_bank.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* MAKTAB Family — one simple access code per school (teachers give it to parents).
   No student records live here: home is for reading, playing and practising.
   The publishable key is designed to be public; the database is guarded by
   Row Level Security and the code check runs through a locked-down function. */
window.MAKTAB_DB = { url: "https://pticimvedwrwuknqbfus.supabase.co",
                     key: "sb_publishable_ZrdQYc81xO4-DLnS96vB6w_MYpRy5kU" };
window.SB = null;
try{ if(window.supabase && window.MAKTAB_DB.url){
  window.SB = window.supabase.createClient(window.MAKTAB_DB.url, window.MAKTAB_DB.key);
}}catch(e){ window.SB = null; }
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F6F4; --card:#FFFFFF; --ink:#173430; --soft:#6E8783;
  --green:#0E8A6D; --mint:#D9F0E7; --coral:#F4593B; --sun:#F5A623; --sky:#2E7CD6;
  --line:#DCE9E4; --shadow:0 6px 22px rgba(23,84,68,.10); --r:22px;
}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--ink);
  background-image:radial-gradient(500px 300px at 100% 0%, rgba(245,166,35,.14), transparent 55%),radial-gradient(520px 320px at 0% 8%, rgba(14,138,109,.12), transparent 55%)}
h1,h2,h3{font-family:'Baloo 2',sans-serif}
button{font-family:inherit;cursor:pointer}
.phone{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
.page{flex:1;padding:18px 18px 110px;display:none}
.page.on{display:block;animation:slide .25s}
@keyframes slide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* gate (the gateway look, kept) */
.login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:30px 24px 60px;text-align:center}
.login .logo{font-family:'Baloo 2';font-size:34px;font-weight:800}
.login .logo em{font-style:normal;color:var(--coral)}
.login .tag{color:var(--soft);font-weight:700;font-size:14px;margin:6px 0 26px}
.note{background:#FFF7E3;border:1.5px solid #F2DFA8;border-radius:14px;padding:12px 16px;font-size:12.5px;font-weight:700;color:#7A5B00;margin-bottom:18px;line-height:1.6;text-align:left}
.code-in{width:100%;padding:15px 18px;border:2px solid var(--line);border-radius:16px;font:inherit;font-weight:800;font-size:17px;text-align:center;letter-spacing:2px;text-transform:uppercase;background:var(--card);margin-bottom:12px}
.code-in:focus{outline:none;border-color:var(--green)}
.gerr{color:var(--coral);font-weight:800;font-size:13px;min-height:20px;margin-bottom:8px}
.bigbtn{width:100%;border:none;border-radius:16px;background:linear-gradient(135deg,var(--green),#28b48f);color:#fff;font-weight:900;font-size:15px;padding:14px;box-shadow:0 8px 20px rgba(14,138,109,.3);transition:.15s}
.bigbtn:hover{transform:translateY(-2px)}
.bigbtn:disabled{opacity:.6;transform:none}
.foot-note{text-align:center;font-size:11px;color:var(--soft);font-weight:700;margin-top:18px;line-height:1.7}

/* header */
.head{padding:16px 18px 4px;display:flex;align-items:center;gap:12px}
.head .av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;box-shadow:var(--shadow);background:var(--mint)}
.head h1{font-size:19px;line-height:1.1}
.head h1 em{font-style:normal;color:var(--coral)}
.head p{font-size:12px;color:var(--soft);font-weight:800}
.head .out{margin-left:auto;border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-size:11px;font-weight:900;color:var(--soft);padding:7px 12px}

/* cards */
.c{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:17px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.c h2{font-size:16px;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.c .sub{font-size:12px;color:var(--soft);font-weight:700;margin-bottom:12px}

/* class pick */
.clsgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.clsbtn{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:18px 10px;text-align:center;box-shadow:var(--shadow);transition:.18s}
.clsbtn:hover{transform:translateY(-2px);border-color:var(--green)}
.clsbtn .e{font-size:30px;display:block;margin-bottom:6px}
.clsbtn b{font-size:14.5px}
.clsbtn small{display:block;color:var(--soft);font-weight:800;font-size:11px;margin-top:2px}

/* books */
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bcard{border:none;background:none;text-align:left;padding:0}
.bcard .cv{width:100%;aspect-ratio:3/4;border-radius:14px;overflow:hidden;box-shadow:0 8px 18px rgba(23,84,68,.2);background:linear-gradient(150deg,var(--sky),var(--green));display:flex;align-items:center;justify-content:center;font-size:34px;border:3px solid #fff;transition:.15s}
.bcard:hover .cv{transform:translateY(-3px)}
.bcard.sel .cv{outline:3px solid var(--green);outline-offset:2px}
.bcard b{font-size:11.5px;display:block;margin-top:7px;line-height:1.25;color:var(--ink)}
.bcard .cv img{width:100%;height:100%;object-fit:cover}
.act-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px}
.abtn{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:11px 8px;font-weight:800;font-size:12.5px;color:var(--ink);transition:.15s;text-align:center}
.abtn:hover{border-color:var(--green);transform:translateY(-1px)}
.abtn .e{font-size:18px;display:block;margin-bottom:3px}
.chiprow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-size:12px;font-weight:800;color:var(--soft);transition:.15s}
.chip.on,.chip:hover{border-color:var(--green);color:var(--green);background:var(--mint)}

/* practice quiz — kid sized */
.kq{border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;background:var(--bg)}
.kq .qt{font-weight:800;font-size:15px;margin-bottom:11px}
.kq .pg{float:right;font-size:10px;color:var(--soft);font-weight:900;background:var(--card);border-radius:99px;padding:2px 8px;border:1px solid var(--line)}
.kops{display:flex;gap:9px;flex-wrap:wrap}
.kop{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px 20px;font-size:17px;font-weight:900;min-width:64px;transition:.15s}
.kop.yes{background:var(--green);border-color:var(--green);color:#fff;animation:pop .35s}
.kop.no{background:var(--coral);border-color:var(--coral);color:#fff;animation:shake .3s}
@keyframes pop{50%{transform:scale(1.15)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.stars{font-size:22px;letter-spacing:3px;text-align:center;margin:6px 0 2px;min-height:28px}

/* tab bar */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:var(--card);border-top:1.5px solid var(--line);display:flex;padding:8px 6px calc(10px + env(safe-area-inset-bottom));z-index:50;border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(23,84,68,.12)}
.tab{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:900;color:var(--soft);padding:6px 2px;border-radius:14px;transition:.15s}
.tab .e{font-size:20px;transition:transform .18s}
.tab.on{color:var(--green)}
.tab.on .e{transform:translateY(-2px) scale(1.15)}
.tab.on::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--green);margin-top:1px}
.toastz{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tz{background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:800;box-shadow:var(--shadow);animation:pop .25s;white-space:nowrap}
</style>
</head>
<body>
<div class="phone" id="app"></div>
<div class="toastz" id="toastz"></div>
<script>
/* ============================================================
   MAKTAB Family — vanilla JS, books from ../AzharEd_Deploy.
   One access code per school. No names, no registers, no links
   to the school's records — home is for reading & practising.
   ============================================================ */
const BASE="../AzharEd_Deploy/";
const C=window.AZHAR_CONTENT||{books:[]};
const QBK=window.AZHAR_QBANK||{};
const BOOKS=C.books||[];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function toast(m){const el=document.createElement("div");el.className="tz";el.textContent=m;$("#toastz").appendChild(el);setTimeout(()=>el.remove(),2300);}
function openPath(p){if(p)window.open(encodeURI(BASE+p),"_blank");}

const LVL_ORDER=["Playgroup","Nursery","Prep","One","Two","Three","Four","Five"];
const LVL_LABEL={One:"Class 1",Two:"Class 2",Three:"Class 3",Four:"Class 4",Five:"Class 5"};
const LVL_EMOJI={Playgroup:"🧸",Nursery:"🐣",Prep:"✏️",One:"🌱",Two:"🚀",Three:"🔭",Four:"🌍",Five:"🏆"};
function levels(){
  const have={}; BOOKS.forEach(b=>{ if(b.level) have[b.level]=(have[b.level]||0)+1; });
  return LVL_ORDER.filter(l=>have[l]).map(l=>({l, n:have[l]}));
}
const lvlName=l=>LVL_LABEL[l]||l;

/* ---------- device memory ---------- */
const PASS_KEY="azfam2:pass", CLS_KEY="azfam2:cls";
function passGet(){ try{return JSON.parse(localStorage.getItem(PASS_KEY)||"null");}catch(e){return null;} }
function passSet(p){ try{ p?localStorage.setItem(PASS_KEY,JSON.stringify(p)):localStorage.removeItem(PASS_KEY); }catch(e){} }
function clsGet(){ try{return localStorage.getItem(CLS_KEY)||"";}catch(e){return "";} }
function clsSet(c){ try{ c?localStorage.setItem(CLS_KEY,c):localStorage.removeItem(CLS_KEY); }catch(e){} }

/* ---------- the code check ---------- */
function withTimeout(promise,ms){return Promise.race([promise,new Promise((_,rej)=>setTimeout(()=>rej(new Error("T")),ms))]);}
/* returns {ok:true,school} | {ok:false,invalid:true} | {ok:false,offline:true} */
async function checkCode(code){
  if(!navigator.onLine||!window.SB) return {ok:false,offline:true};
  try{
    const {data,error}=await withTimeout(SB.rpc("family_access",{p_code:code}),12000);
    if(error) return {ok:false,offline:true};
    if(data&&data.length) return {ok:true,school:data[0].school_name};
    return {ok:false,invalid:true};
  }catch(e){ return {ok:false,offline:true}; }
}

/* ---------- state ---------- */
let pass=passGet(), cls=clsGet(), tab="books", selBook=null, pbook=null,
    quiz={qs:[],done:0,right:0,stars:""};

/* ---------- gate (the gateway, kept) ---------- */
function renderGate(msg){
  $("#app").innerHTML=`<div class="login">
    <div class="logo">MAKTA<em>B</em> Family</div>
    <div class="tag">Your school's books at home — read, play &amp; practise</div>
    <div class="note">🔑 <b>One code for the whole school.</b> Ask your child's teacher for the school's family code — type it once and this device stays signed in.</div>
    <input class="code-in" id="codeIn" placeholder="SCHOOL CODE" autocomplete="off" autocapitalize="characters"/>
    <div class="gerr" id="gerr">${esc(msg||"")}</div>
    <button class="bigbtn" id="goBtn">Enter</button>
    <div class="foot-note">MAKTAB Family · Azhar Publishers — the same books used in class.<br/>No school records live here — just reading, playing and practising.</div>
  </div>`;
  const go=$("#goBtn"), inp=$("#codeIn");
  inp.onkeydown=e=>{ if(e.key==="Enter") go.click(); };
  go.onclick=async()=>{
    const code=(inp.value||"").trim().toUpperCase();
    if(!code){ $("#gerr").textContent="Type the school code first."; return; }
    go.disabled=true; go.textContent="Checking…";
    const r=await checkCode(code);
    if(r.ok){
      pass={code,school:r.school,at:Date.now()}; passSet(pass);
      toast("Welcome, "+r.school+" families! 🎒");
      route();
    }else if(r.invalid){
      go.disabled=false; go.textContent="Enter";
      $("#gerr").textContent="That code isn't active — please check with the school.";
    }else{
      const stored=passGet();
      if(stored&&stored.code===code){ pass=stored; toast("Signed in offline 📴"); route(); }
      else{ go.disabled=false; go.textContent="Enter";
        $("#gerr").textContent="Internet is needed the first time — please connect and try again."; }
    }
  };
}

/* ---------- class pick ---------- */
function renderCls(){
  $("#app").innerHTML=`<div class="login" style="justify-content:flex-start;padding-top:46px">
    <div class="logo" style="font-size:26px">MAKTA<em>B</em> Family</div>
    <div class="tag">${esc(pass.school)}</div>
    <div class="c" style="text-align:left"><h2>🎒 Which class is your child in?</h2>
      <div class="sub">You can change this any time from the top of the screen.</div>
      <div class="clsgrid">
        ${levels().map(x=>`<button class="clsbtn" data-cls="${x.l}">
          <span class="e">${LVL_EMOJI[x.l]||"📘"}</span><b>${esc(lvlName(x.l))}</b>
          <small>${x.n} book${x.n>1?"s":""}</small></button>`).join("")}
      </div></div>
  </div>`;
  document.querySelectorAll("[data-cls]").forEach(b=>b.onclick=()=>{
    cls=b.dataset.cls; clsSet(cls); selBook=null; pbook=null; makeQuiz(); route();
  });
}

/* ---------- app shell ---------- */
function head(){
  return `<div class="head">
    <span class="av">🏫</span>
    <div><h1>MAKTA<em>B</em> Family</h1><p>${esc(pass.school)} · ${esc(lvlName(cls))}</p></div>
    <button class="out" id="clsBtn">Change class</button>
  </div>`;
}
const clsBooks=()=>BOOKS.filter(b=>b.level===cls);

/* ---------- books ---------- */
function pgBooks(){
  const books=clsBooks();
  const sel=books.find(b=>b.id===selBook);
  return `<div class="page on">
   ${sel?`<div class="c"><h2>${sel.icon||"📘"} ${esc(sel.title)}</h2>
     <div class="sub">${esc(sel.subject||"")} · ${esc(lvlName(cls))}</div>
     <div class="act-row">
       ${sel.flipbook?`<button class="abtn" data-open="${esc(sel.flipbook)}"><span class="e">📖</span>Read the flipbook</button>`:""}
       ${sel.interactive?`<button class="abtn" data-open="${esc(sel.interactive)}"><span class="e">🎯</span>Play the lesson</button>`:""}
       ${QBK[sel.id]?`<button class="abtn" id="quizJump"><span class="e">⭐</span>Practise questions</button>`:""}
     </div></div>`:""}
   <div class="c"><h2>📚 ${esc(lvlName(cls))} books</h2>
    <div class="sub">Tap a book, then read the flipbook together or let your child play the lesson.</div>
    <div class="bgrid">${books.map(b=>`
      <button class="bcard${b.id===selBook?" sel":""}" data-book="${b.id}">
        <span class="cv">${b.coverImg?`<img src="${encodeURI(BASE+b.coverImg)}" loading="lazy"/>`:(b.icon||"📘")}</span>
        <b>${esc(b.title)}</b></button>`).join("")}
    </div></div>
   <div class="foot-note">Reading together for 10 minutes a day makes the biggest difference of all. 💚</div>
  </div>`;
}

/* ---------- practice ---------- */
function qBooks(){ return clsBooks().filter(b=>QBK[b.id]); }
function makeQuiz(bookId){
  const withQ=qBooks();
  quiz={qs:[],done:0,right:0,stars:"",book:null};
  if(!withQ.length) return;
  quiz.book=withQ.find(b=>b.id===bookId)||withQ[Math.floor(Math.random()*withQ.length)];
  pbook=quiz.book.id;
  const items=(QBK[quiz.book.id].items||[]).filter(q=>q.k==="mcq"&&q.options&&q.options.length<=4);
  const used={};
  while(quiz.qs.length<3&&quiz.qs.length<items.length){
    const q=items[Math.floor(Math.random()*items.length)];
    if(!used[q.text]){used[q.text]=1;quiz.qs.push(q);}
  }
}
function pgPractice(){
  const withQ=qBooks();
  if(!withQ.length) return `<div class="page on"><div class="c"><h2>⭐ Practice time!</h2>
    <div class="sub">No practice questions for ${esc(lvlName(cls))} yet — try the flipbooks and lessons in Books!</div></div></div>`;
  if(!quiz.qs.length) makeQuiz(pbook);
  return `<div class="page on">
   <div class="c"><h2>⭐ Practice time!</h2>
    <div class="sub">Real questions from the pages taught in class. Tap the answer!</div>
    <div class="chiprow">${withQ.map(b=>`<button class="chip${quiz.book&&b.id===quiz.book.id?" on":""}" data-qb="${b.id}">${b.icon||"📘"} ${esc(b.title)}</button>`).join("")}</div>
    <div class="stars" id="qStars">${quiz.stars}</div>
    ${quiz.qs.map((q,qi)=>`
      <div class="kq"><div class="qt"><span class="pg">p. ${q.pg}</span>${esc(q.text)}</div>
        <div class="kops">${q.options.map((o,oi)=>`<button class="kop" data-q="${qi}" data-o="${oi}">${esc(o)}</button>`).join("")}</div>
      </div>`).join("")}
    <button class="bigbtn" id="newQuiz">🔄 More questions</button>
   </div>
  </div>`;
}

/* ---------- help ---------- */
function pgHelp(){
  return `<div class="page on">
   <div class="c"><h2>💡 How MAKTAB Family works</h2>
    <div class="sub">${esc(pass.school)}</div>
    <div style="font-size:13px;font-weight:700;line-height:1.9;color:var(--ink)">
      📚 <b>Books</b> — open your child's class books: read the flipbook together, or let them play the interactive lesson.<br/>
      ⭐ <b>Practice</b> — quick friendly questions from the same books, with stars for right answers.<br/>
      🎒 <b>Change class</b> any time from the button at the top.<br/>
      🔑 One family code works for the whole school — if it ever stops working, ask the school for the new code.
    </div></div>
   <div class="c"><h2>🏫 About school records</h2>
    <div class="sub" style="margin:0;line-height:1.7">Attendance, fees and report cards are kept safely at the school — please contact the school office for those. This portal is just for learning at home.</div></div>
   <div class="c"><button class="bigbtn" id="outBtn" style="background:var(--card);color:var(--coral);border:2px solid var(--line);box-shadow:none">Sign out of this device</button></div>
   <div class="foot-note">MAKTAB Family · Azhar Publishers · Lahore — since 1972</div>
  </div>`;
}

/* ---------- render ---------- */
function render(){
  $("#app").innerHTML=head()+
    (tab==="books"?pgBooks():tab==="practice"?pgPractice():pgHelp())+
    `<div class="tabs">
      ${[["books","📚","Books"],["practice","⭐","Practice"],["help","💡","Help"]].map(t=>
        `<button class="tab${tab===t[0]?" on":""}" data-tab="${t[0]}"><span class="e">${t[1]}</span>${t[2]}</button>`).join("")}
    </div>`;
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});
  const cb=$("#clsBtn"); if(cb) cb.onclick=()=>{ renderCls(); };
  document.querySelectorAll("[data-book]").forEach(b=>b.onclick=()=>{
    selBook=(selBook===b.dataset.book)?null:b.dataset.book; render();
    if(selBook) window.scrollTo({top:0,behavior:"smooth"});
  });
  document.querySelectorAll("[data-open]").forEach(x=>x.onclick=()=>openPath(x.dataset.open));
  const qj=$("#quizJump"); if(qj) qj.onclick=()=>{ makeQuiz(selBook); tab="practice"; render(); };
  document.querySelectorAll("[data-qb]").forEach(b=>b.onclick=()=>{ makeQuiz(b.dataset.qb); render(); });
  const nq=$("#newQuiz"); if(nq) nq.onclick=()=>{ makeQuiz(pbook); render(); };
  document.querySelectorAll(".kop").forEach(b=>b.onclick=()=>{
    const q=quiz.qs[+b.dataset.q];
    if(b.parentElement.querySelector(".yes,.no"))return;
    if(q.options[+b.dataset.o]===q.answer){b.classList.add("yes");quiz.right++;quiz.stars+="⭐";}
    else{b.classList.add("no");[...b.parentElement.children].forEach(o=>{if(o.textContent===q.answer)o.classList.add("yes");});quiz.stars+="💪";}
    quiz.done++;
    $("#qStars").textContent=quiz.stars;
    if(quiz.done===quiz.qs.length) toast(quiz.right===quiz.qs.length?"🌟 Perfect! Great job!":"Well done — "+quiz.right+" out of "+quiz.qs.length+"!");
  });
  const ob=$("#outBtn"); if(ob) ob.onclick=()=>{
    if(confirm("Sign this device out of MAKTAB Family?")){ pass=null; passSet(null); cls=""; clsSet(""); route(); }
  };
}

/* ---------- routing + background re-check ---------- */
function route(){
  if(!pass) return renderGate();
  if(!cls) return renderCls();
  render();
}
route();
/* quiet revalidation: if the school's code was changed or the school was
   suspended, the pass stops working on the next online visit. */
if(pass&&navigator.onLine&&window.SB){
  checkCode(pass.code).then(r=>{
    if(r.invalid){ pass=null; passSet(null); renderGate("This code is no longer active — ask the school for the new code."); }
    else if(r.ok&&r.school!==pass.school){ pass.school=r.school; passSet(pass); }
  }).catch(()=>{});
}
</script>
<script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('/sw.js').catch(function(){})}</script>
</body>
